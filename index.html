<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Steven Guarino — Photography</title>

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

<meta property="og:type" content="website" />
<meta property="og:title" content="Steven Guarino — Photography" />
<meta property="og:description" content="Wildlife, astrophotography, macro, and street photography." />
<meta property="og:url" content="https://stevenguarino1.github.io/photo-portfolio/" />
<meta property="og:image" content="https://stevenguarino1.github.io/photo-portfolio/photos/4@2x.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Steven Guarino — Photography" />
<meta name="twitter:description" content="Wildlife, astrophotography, macro, and street photography." />
<meta name="twitter:image" content="https://stevenguarino1.github.io/photo-portfolio/photos/4@2x.jpg" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #121212;
    --text: #e8e8e8;
    --muted: #8a8a8a;
    /* side padding matches levonbiss.com at 1400px; gutters tightened for a denser grid */
    --gap: clamp(10px, 1.6vw, 24px);
    --side-padding: clamp(20px, 3vw, 42px);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  a { color: inherit; }

  /* ---------- Header ---------- */

  .site-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px 32px;
    padding: clamp(26px, 2.9vw, 40px) var(--side-padding);
  }

  .site-header .logo {
    /* tracks the reference's fluid scaling: 22.1px @1024, 24.4px @1400 */
    font-size: clamp(1.15rem, 1rem + 0.6vw, 2.1rem);
    letter-spacing: -0.02em;
    font-weight: 400;
    text-decoration: none;
    white-space: nowrap;
  }

  .logo-mark {
    color: var(--muted);
    font-size: 0.82em;
  }

  .logo-mark::before {
    content: "/";
    margin-right: 0.5em;
    opacity: 0.45;
  }

  .site-nav {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 26px;
  }

  .nav-link {
    font-family: inherit;
    font-size: clamp(0.85rem, 0.7rem + 0.5vw, 1rem);
    color: inherit;
    background: none;
    border: 0;
    padding: 2px 0;
    cursor: pointer;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    opacity: 0.75;
    transition: opacity 150ms ease;
  }

  .nav-link:hover {
    opacity: 1;
  }

  .nav-link.is-active {
    opacity: 1;
    border-bottom-color: currentColor;
  }

  /* ---------- Gallery ---------- */

  main {
    padding: var(--side-padding) var(--side-padding) var(--gap);
  }

  .gallery {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }

  .gallery-row {
    display: flex;
    align-items: flex-start;
    gap: var(--gap);
  }

  .gallery-row.is-centered { justify-content: center; }

  /* The tile holds the placeholder color while its photo fades in. */
  .tile {
    min-width: 0;
    background: #1c1c1c;
  }

  .gallery img {
    display: block;
    width: 100%;
    height: auto;
    cursor: pointer;
    opacity: 0;
    transition: opacity 400ms ease;
  }

  .gallery img.is-loaded { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .gallery img { transition: none; }
  }

  /* ---------- Footer ---------- */

  .site-footer {
    padding: 28px var(--side-padding) 44px;
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
    line-height: 1.6;
  }

  .site-footer p { margin: 0; }

  /* ---------- Lightbox ---------- */

  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(18, 18, 18, 0.6);
    backdrop-filter: blur(24px) saturate(0.65);
    -webkit-backdrop-filter: blur(24px) saturate(0.65);
    opacity: 0;
    transition: opacity 200ms ease;
  }

  .lightbox[hidden] {
    display: flex;
    visibility: hidden;
    pointer-events: none;
  }

  .lightbox.is-open {
    opacity: 1;
    pointer-events: auto;
  }

  .lightbox-stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 99vw;
    max-height: 99vh;
  }

  .lightbox-frame {
    position: relative;
    display: inline-block;
    line-height: 0;
    isolation: isolate;
  }

  .lightbox-frame::before {
    content: "";
    position: absolute;
    inset: 0;
    transform: scale(2.2);
    background: radial-gradient(
      ellipse closest-side at center,
      rgba(0, 0, 0, 0.55) 0%,
      rgba(0, 0, 0, 0.55) calc(100% / 2.2),
      rgba(0, 0, 0, 0) 100%
    );
    pointer-events: none;
    z-index: -1;
  }

  #lightbox-img {
    display: block;
    width: auto;
    height: auto;
    max-width: var(--lb-max-w, 97vw);
    max-height: var(--lb-max-h, 92vh);
    border: 1px solid rgba(255, 255, 255, 0.12);
  }

  .lightbox-exif {
    margin: 16px 0 0;
    font-size: 1rem;
    color: #e8e8e8;
    text-align: center;
  }

  .lightbox-exif:empty { display: none; }

  .lightbox-btn {
    position: absolute;
    z-index: 1;
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.35);
    color: #e8e8e8;
    cursor: pointer;
    opacity: 0.75;
    transition: opacity 150ms ease, background-color 150ms ease;
  }

  .lightbox-btn:hover,
  .lightbox-btn:focus-visible {
    opacity: 1;
    background: rgba(0, 0, 0, 0.6);
  }

  .lightbox-btn[hidden] { display: none; }

  .lightbox-btn svg { width: 22px; height: 22px; }

  .lightbox-close { top: 14px; right: 14px; }

  .lightbox-prev,
  .lightbox-next {
    top: 50%;
    transform: translateY(-50%);
  }

  .lightbox-prev { left: 14px; }
  .lightbox-next { right: 14px; }

  /* Touch screens swipe between photos instead. */
  @media (hover: none) {
    .lightbox-prev,
    .lightbox-next { display: none; }
  }

  body.lightbox-open { overflow: hidden; }
</style>
</head>
<body>

  <header class="site-header">
    <a class="logo" href="./">Steven Guarino <span class="logo-mark">Archive</span></a>
    <nav class="site-nav" id="siteNav">
      <button class="nav-link is-active" type="button" data-filter="all">All</button>
      <button class="nav-link" type="button" data-filter="Wildlife">Wildlife</button>
      <button class="nav-link" type="button" data-filter="Night Sky">Night Sky</button>
      <button class="nav-link" type="button" data-filter="Landscape">Landscape</button>
      <button class="nav-link" type="button" data-filter="Close-Up">Close-Up</button>
      <button class="nav-link" type="button" data-filter="Aviation">Aviation</button>
    </nav>
  </header>

  <main>
    <div class="gallery" id="grid"></div>
  </main>

  <footer class="site-footer">
    <p>Sony a6700 · Sigma 17-40mm f/1.8 · Sigma 150-600mm DG DN Sports</p>
  </footer>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <button class="lightbox-btn lightbox-close" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
    </button>
    <button class="lightbox-btn lightbox-prev" type="button" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
    </button>
    <button class="lightbox-btn lightbox-next" type="button" aria-label="Next photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
    </button>
    <div class="lightbox-stage">
      <div class="lightbox-frame">
        <img id="lightbox-img" src="" alt="" />
      </div>
      <p id="lightbox-exif" class="lightbox-exif"></p>
    </div>
  </div>

  <script src="js/photos.js?v=4"></script>
  <script>
    // ---------- Gallery ----------

    // Newest first, but a photo waits while one from the same outing (same
    // category, taken within a few hours) is among the last few placed, and
    // same-category neighbours are avoided when there's a choice. Sorting purely
    // by date lined up near-identical frames from one shoot.
    const OUTING_GAP = 3 * 60 * 60 * 1000;
    const SPREAD = 6; // about a row and a half, so lookalikes don't stack either
    const timeOf = (photo) => (photo.dateTaken ? Date.parse(photo.dateTaken) : 0);
    const sameOuting = (a, b) =>
      a.category === b.category && Math.abs(timeOf(a) - timeOf(b)) <= OUTING_GAP;

    function mixed(photos) {
      const pool = photos.slice().sort((a, b) => timeOf(b) - timeOf(a));
      const out = [];
      while (pool.length) {
        const recent = out.slice(-SPREAD);
        const last = out[out.length - 1];
        const fresh = (photo) => !recent.some((placed) => sameOuting(photo, placed));
        let pick = pool.findIndex((photo) => fresh(photo) && (!last || photo.category !== last.category));
        if (pick === -1) pick = pool.findIndex(fresh);
        if (pick === -1) pick = 0;
        out.push(pool.splice(pick, 1)[0]);
      }
      return out;
    }

    const orderedPhotos = mixed(PHOTOS);

    const grid = document.getElementById("grid");
    const ratioOf = (photo) => (photo.width && photo.height ? photo.width / photo.height : 1.5);

    // The grid loads small copies from photos/thumbs/ (made by
    // tools/make_thumbs.py) sized to each tile; the lightbox still shows the
    // full-size files.
    const THUMB_WIDTHS = [480, 800, 1200]; // keep in sync with tools/make_thumbs.py

    function gridSrcset(photo) {
      const stem = photo.file.split("/").pop().replace(/\.[^.]+$/, "");
      const sources = THUMB_WIDTHS.map((w) => `photos/thumbs/${stem}-${w}.jpg ${w}w`);
      if (photo.width > THUMB_WIDTHS[THUMB_WIDTHS.length - 1]) {
        sources.push(`${photo.file} ${photo.width}w`);
      }
      return sources.join(", ");
    }

    const tileFor = new Map();
    orderedPhotos.forEach((photo, index) => {
      const img = document.createElement("img");
      img.alt = photo.alt || "";
      if (photo.title) img.title = photo.title;
      if (photo.width && photo.height) {
        img.width = photo.width;
        img.height = photo.height;
      }
      img.loading = index < 6 ? "eager" : "lazy";
      img.decoding = "async";
      img.addEventListener("load", () => img.classList.add("is-loaded"));
      // No thumbnails yet (make_thumbs.py not run): use the full-size files.
      img.addEventListener(
        "error",
        () => {
          img.srcset = photo.file2x ? `${photo.file} 1x, ${photo.file2x} 2x` : "";
          img.src = photo.file;
        },
        { once: true }
      );
      img.sizes = "(max-width: 620px) 100vw, 33vw"; // refined per tile in layout()
      img.srcset = gridSrcset(photo);
      img.src = photo.file;
      img.addEventListener("click", () => openLightbox(photo));

      const tile = document.createElement("div");
      tile.className = "tile";
      tile.appendChild(img);
      tileFor.set(photo, tile);
    });

    // Row size follows a repeating pattern of photos-per-row, so the page
    // alternates between bands of three larger frames and bands of four or five
    // smaller ones. Fitting rows to target heights instead collapses toward a
    // single height, because most of this set shares one aspect ratio.
    function rowPlanFor(width) {
      if (width < 620) return { pattern: [1, 2, 2], maxH: width * 1.2, minH: width * 0.3 };
      if (width < 1000) return { pattern: [2, 3, 3, 4], maxH: width * 0.5, minH: width * 0.15 };
      return { pattern: [3, 5, 4, 3, 4, 5], maxH: width * 0.32, minH: width * 0.1 };
    }

    function layout(photos) {
      const width = grid.clientWidth;
      if (!width) return;

      const gap = parseFloat(getComputedStyle(grid).rowGap) || 0;
      const { pattern, maxH, minH } = rowPlanFor(width);

      const heightOf = (slice) => {
        const ratioSum = slice.reduce((sum, photo) => sum + ratioOf(photo), 0);
        return (width - gap * (slice.length - 1)) / ratioSum;
      };

      const rows = [];
      let cursor = 0;

      while (cursor < photos.length) {
        const remaining = photos.length - cursor;
        let count = Math.min(pattern[rows.length % pattern.length], remaining);

        // A run of portraits or panoramas can still tower or squash at the
        // pattern's count, so nudge it until the row sits in range.
        while (count < remaining && heightOf(photos.slice(cursor, cursor + count)) > maxH) count++;
        while (count > 1 && heightOf(photos.slice(cursor, cursor + count)) < minH) count--;

        rows.push(photos.slice(cursor, cursor + count));
        cursor += count;
      }

      // The final row only gets the leftovers, often too few to fill the width.
      // Re-split it with the row above so both fill it, as evenly as possible.
      if (rows.length > 1 && heightOf(rows[rows.length - 1]) > maxH) {
        const pair = rows[rows.length - 2].concat(rows[rows.length - 1]);
        let best = null;
        for (let split = 1; split < pair.length; split++) {
          const a = heightOf(pair.slice(0, split));
          const b = heightOf(pair.slice(split));
          if (Math.max(a, b) > maxH || Math.min(a, b) < minH) continue;
          if (!best || Math.abs(a - b) < best.diff) best = { split, diff: Math.abs(a - b) };
        }
        if (best) rows.splice(-2, 2, pair.slice(0, best.split), pair.slice(best.split));
      }

      // A lone row (a category with only a photo or two) may run a little
      // taller to fill the width; past that it sits at the cap, centred so it
      // reads as deliberate rather than as a row missing a photo.
      const lone = rows.length === 1;
      const cap = lone ? maxH * 1.25 : maxH;

      grid.textContent = "";
      rows.forEach((rowPhotos) => {
        const height = heightOf(rowPhotos);
        const loose = height > cap;

        const row = document.createElement("div");
        row.className = loose && lone ? "gallery-row is-centered" : "gallery-row";
        rowPhotos.forEach((photo) => {
          const tile = tileFor.get(photo);
          const tileWidth = (loose ? cap : height) * ratioOf(photo);
          if (loose) {
            tile.style.flex = "0 0 auto";
            tile.style.width = `${Math.round(tileWidth)}px`;
          } else {
            tile.style.flex = `${ratioOf(photo)} 1 0%`;
            tile.style.width = "";
          }
          // Lets the browser pick the smallest thumbnail that stays sharp.
          tile.firstChild.sizes = `${Math.ceil(tileWidth)}px`;
          row.appendChild(tile);
        });
        grid.appendChild(row);
      });
    }

    let visiblePhotos = orderedPhotos;

    function showCategory(filter) {
      document
        .querySelectorAll("#siteNav .nav-link")
        .forEach((el) => el.classList.toggle("is-active", el.dataset.filter === filter));

      visiblePhotos =
        filter === "all" ? orderedPhotos : mixed(PHOTOS.filter((p) => p.category === filter));
      layout(visiblePhotos);
    }

    // The category lives in the URL (#night-sky), so a link can open straight
    // to it and a reload keeps it.
    const slugOf = (filter) => filter.toLowerCase().replace(/[^a-z0-9]+/g, "-");

    function categoryFromHash() {
      const btn = [...document.querySelectorAll("#siteNav .nav-link")].find(
        (el) => slugOf(el.dataset.filter) === location.hash.slice(1)
      );
      return btn ? btn.dataset.filter : "all";
    }

    showCategory(categoryFromHash());

    document.getElementById("siteNav").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-filter]");
      if (!btn) return;

      const filter = btn.dataset.filter;
      const url = filter === "all" ? location.pathname + location.search : `#${slugOf(filter)}`;
      history.replaceState(null, "", url);
      showCategory(filter);
    });

    window.addEventListener("hashchange", () => {
      if (lightboxOpen) closeLightbox();
      showCategory(categoryFromHash());
    });

    let lastWidth = window.innerWidth;
    let resizeTimer;
    window.addEventListener("resize", () => {
      if (window.innerWidth === lastWidth) return;
      lastWidth = window.innerWidth;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => layout(visiblePhotos), 150);
    });

    // ---------- Lightbox ----------

    function formatExif(photo) {
      const parts = [];
      if (photo.aperture) parts.push(photo.aperture);
      if (photo.shutter) parts.push(photo.shutter);
      if (photo.iso) parts.push(`ISO ${photo.iso}`);
      return parts.join(" · ");
    }

    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const lightboxExif = document.getElementById("lightbox-exif");
    const closeBtn = lightbox.querySelector(".lightbox-close");
    const prevBtn = lightbox.querySelector(".lightbox-prev");
    const nextBtn = lightbox.querySelector(".lightbox-next");

    // Index into visiblePhotos, so browsing follows the grid's current order
    // and category.
    let current = 0;

    function sizeLightboxImage() {
      const margin = 14;
      const captionSpace = 52;
      const maxW = Math.round(window.innerWidth - margin * 2);
      const maxH = Math.round(window.innerHeight - margin * 2 - captionSpace);
      lightboxImg.style.setProperty("--lb-max-w", `${maxW}px`);
      lightboxImg.style.setProperty("--lb-max-h", `${maxH}px`);
    }

    const fullSrcset = (photo) => (photo.file2x ? `${photo.file} 1x, ${photo.file2x} 2x` : "");

    function showPhoto(index) {
      const count = visiblePhotos.length;
      current = (index + count) % count;
      const photo = visiblePhotos[current];

      lightboxImg.src = photo.file;
      lightboxImg.alt = photo.alt || "";
      if (photo.file2x) {
        lightboxImg.srcset = fullSrcset(photo);
      } else {
        lightboxImg.removeAttribute("srcset");
      }
      lightboxExif.textContent = formatExif(photo);

      // Fetch the neighbours now so stepping to them is instant.
      [current - 1, current + 1].forEach((i) => {
        const neighbour = visiblePhotos[(i + count) % count];
        const preload = new Image();
        preload.srcset = fullSrcset(neighbour);
        preload.src = neighbour.file;
      });
    }

    function openLightbox(photo) {
      showPhoto(visiblePhotos.indexOf(photo));
      prevBtn.hidden = nextBtn.hidden = visiblePhotos.length < 2;

      sizeLightboxImage();
      lightboxOpen = true;
      lightbox.hidden = false;
      document.body.classList.add("lightbox-open");
      requestAnimationFrame(() => lightbox.classList.add("is-open"));
      closeBtn.focus({ preventScroll: true });
    }

    let lightboxOpen = false;

    function closeLightbox() {
      lightboxOpen = false;
      if (lightbox.contains(document.activeElement)) document.activeElement.blur();
      lightbox.classList.remove("is-open");
      document.body.classList.remove("lightbox-open");

      // Hide once the fade-out ends. The timer covers a fade that never ran
      // (closed before it started), which would otherwise leave an invisible
      // overlay swallowing clicks; reopening mid-fade cancels the hide.
      const hide = () => {
        clearTimeout(timer);
        lightbox.removeEventListener("transitionend", onEnd);
        if (!lightboxOpen) lightbox.hidden = true;
      };
      const onEnd = (e) => {
        if (e.target === lightbox) hide();
      };
      const timer = setTimeout(hide, 300);
      lightbox.addEventListener("transitionend", onEnd);
    }

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox || e.target === lightbox.querySelector(".lightbox-stage")) {
        closeLightbox();
      }
    });

    closeBtn.addEventListener("click", closeLightbox);
    prevBtn.addEventListener("click", () => showPhoto(current - 1));
    nextBtn.addEventListener("click", () => showPhoto(current + 1));

    document.addEventListener("keydown", (e) => {
      if (!lightboxOpen) return;
      if (e.key === "Escape") closeLightbox();
      else if (e.key === "ArrowRight") showPhoto(current + 1);
      else if (e.key === "ArrowLeft") showPhoto(current - 1);
    });

    // Swipe left/right to move between photos on touch screens. A second
    // finger (pinch-zooming) cancels it.
    const SWIPE_THRESHOLD = 50; // px
    let touchStart = null;

    lightbox.addEventListener(
      "touchstart",
      (e) => {
        touchStart =
          e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
      },
      { passive: true }
    );

    lightbox.addEventListener(
      "touchend",
      (e) => {
        if (!touchStart || e.touches.length) return;
        const dx = e.changedTouches[0].clientX - touchStart.x;
        const dy = e.changedTouches[0].clientY - touchStart.y;
        touchStart = null;
        if (Math.abs(dx) < SWIPE_THRESHOLD || Math.abs(dx) < Math.abs(dy)) return;
        showPhoto(current + (dx < 0 ? 1 : -1));
      },
      { passive: true }
    );

    window.addEventListener("resize", () => {
      if (!lightbox.hidden) sizeLightboxImage();
    });

  </script>
</body>
</html>
