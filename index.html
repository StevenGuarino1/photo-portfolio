<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Steven Guarino — Photography</title>
<meta name="description" content="Wildlife, astrophotography, macro, and street photography by Steven Guarino." />
<meta name="theme-color" content="#121212" />

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

<meta property="og:type" content="website" />
<meta property="og:title" content="Steven Guarino — Photography" />
<meta property="og:description" content="Wildlife, astrophotography, macro, and street photography." />
<meta property="og:url" content="https://stevenguarino1.github.io/photo-portfolio/" />
<meta property="og:image" content="https://stevenguarino1.github.io/photo-portfolio/photos/4@2x.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Steven Guarino — Photography" />
<meta name="twitter:description" content="Wildlife, astrophotography, macro, and street photography." />
<meta name="twitter:image" content="https://stevenguarino1.github.io/photo-portfolio/photos/4@2x.jpg" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #121212;
    --text: #e8e8e8;
    --muted: #8a8a8a;
    --gap: clamp(10px, 1.6vw, 24px);
    --top-padding: clamp(20px, 3vw, 42px);
    /* Side margins frame the page like a mat; past --content-max the page
       stops widening and centres instead. */
    --content-max: 1600px;
    --side-padding: max(clamp(20px, 6vw, 96px), calc((100% - var(--content-max)) / 2));
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  /* Keep the scrollbar's space when the lightbox locks scrolling, so the grid
     doesn't reflow (and redraw every photo) as it opens. */
  html { scrollbar-gutter: stable; }

  a { color: inherit; }

  /* ---------- Header ---------- */

  .site-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px 32px;
    padding: clamp(26px, 2.9vw, 40px) var(--side-padding);
  }

  .site-header .logo {
    /* tracks the reference's fluid scaling: 22.1px @1024, 24.4px @1400 */
    font-size: clamp(1.15rem, 1rem + 0.6vw, 2.1rem);
    letter-spacing: -0.02em;
    font-weight: 400;
    text-decoration: none;
    white-space: nowrap;
  }

  .logo-mark {
    color: var(--muted);
    font-size: 0.82em;
  }

  .logo-mark::before {
    content: "/";
    margin-right: 0.5em;
    opacity: 0.45;
  }

  .site-nav {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 26px;
  }

  .nav-link {
    font-family: inherit;
    font-size: clamp(0.85rem, 0.7rem + 0.5vw, 1rem);
    color: inherit;
    background: none;
    border: 0;
    padding: 2px 0;
    cursor: pointer;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    opacity: 0.75;
    transition: opacity 150ms ease;
  }

  .nav-link:hover {
    opacity: 1;
  }

  .nav-link.is-active {
    opacity: 1;
    border-bottom-color: currentColor;
  }

  /* ---------- Gallery ---------- */

  main {
    padding: var(--top-padding) var(--side-padding) var(--gap);
  }

  .gallery {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }

  .gallery-row {
    display: flex;
    align-items: flex-start;
    gap: var(--gap);
  }

  .gallery-row.is-centered { justify-content: center; }

  /* The tile is the photo's fixed spot in the grid; the card inside it is
     what lifts and tilts on hover, so the hover area never moves. The card
     holds the placeholder color while its photo fades in. */
  .tile { min-width: 0; }
  .card { background: #1c1c1c; }

  .gallery img {
    display: block;
    width: 100%;
    height: auto;
    cursor: pointer;
    opacity: 0;
    transition: opacity 400ms ease;
  }

  .gallery img.is-loaded { opacity: 1; }

  /* Tabbing through the photos: a hairline round the one in focus, clear
     of its edge. */
  .gallery img:focus { outline: none; }
  .gallery img:focus-visible { outline: 1px solid rgba(232, 232, 232, 0.7); outline-offset: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .gallery img { transition: none; }
  }

  /* Everything fades: the header and footer as the page opens, each photo as
     it scrolls into view (layout() adds is-in and staggers a row), and the
     whole grid out and back when the category changes. */
  @media (prefers-reduced-motion: no-preference) {
    .site-header,
    .site-footer { animation: fade-in 700ms ease both; }

    .gallery { transition: opacity 240ms ease; }
    .gallery.is-leaving { opacity: 0; pointer-events: none; }

    .tile {
      opacity: 0;
      transform: translateY(18px);
      transition:
        opacity 700ms ease var(--reveal-delay, 0ms),
        transform 700ms cubic-bezier(0.2, 0.8, 0.2, 1) var(--reveal-delay, 0ms);
    }

    .tile.is-in {
      opacity: 1;
      transform: none;
    }
  }

  @keyframes fade-in {
    from { opacity: 0; }
  }

  /* ---------- Hover (mouse only) ----------
     The photo under the cursor lifts off the page: it glides up a little and
     grows slightly over a deep, soft shadow. Nothing else is drawn on or
     around it, and it doesn't follow the cursor. */

  /* How much a hovered photo enlarges. layout() reads it too, to load
     thumbnails sharp enough for the enlarged size. */
  :root { --hover-scale: 1; }

  @media (hover: hover) and (pointer: fine) {
    .tile {
      position: relative;
      z-index: 0;
    }

    .tile:hover { z-index: 2; }

    .card { transition: box-shadow 300ms ease; }

    .tile:hover .card { box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.85); }
  }

  /* The glide itself, skipped for reduced motion (the shadow still shows). */
  @media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
    :root { --hover-scale: 1.06; }

    .card {
      transition:
        scale 500ms cubic-bezier(0.22, 1, 0.36, 1),
        translate 500ms cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 300ms ease;
    }

    .tile:hover .card {
      scale: var(--hover-scale);
      translate: 0 -14px;
    }
  }

  /* ---------- Footer ---------- */

  .site-footer {
    padding: 28px var(--side-padding) 44px;
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
    line-height: 1.6;
  }

  .site-footer p { margin: 0; }

  /* ---------- Lightbox ---------- */

  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Near-opaque rather than a backdrop blur: re-blurring the whole page on
       every frame made the open/close morph stutter. */
    background: rgba(18, 18, 18, 0.94);
    opacity: 0;
    transition: opacity 200ms ease;
  }

  .lightbox[hidden] {
    display: flex;
    visibility: hidden;
    pointer-events: none;
  }

  .lightbox.is-open {
    opacity: 1;
    pointer-events: auto;
  }

  .lightbox-stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 99vw;
    max-height: 99vh;
  }

  .lightbox-frame {
    position: relative;
    display: inline-block;
    line-height: 0;
    isolation: isolate;
  }

  .lightbox-frame::before {
    content: "";
    position: absolute;
    inset: 0;
    transform: scale(2.2);
    background: radial-gradient(
      ellipse closest-side at center,
      rgba(0, 0, 0, 0.55) 0%,
      rgba(0, 0, 0, 0.55) calc(100% / 2.2),
      rgba(0, 0, 0, 0) 100%
    );
    pointer-events: none;
    z-index: -1;
  }

  /* Sized by fitLightboxImage(), so it holds steady while the full-size file
     loads over the grid's copy. */
  #lightbox-img {
    display: block;
    border: 1px solid rgba(255, 255, 255, 0.12);
    cursor: zoom-out; /* clicking it closes the view */
  }

  /* Opening and closing morph the photo between its grid tile and the big
     view (a view transition; see openLightbox). */
  ::view-transition-group(photo),
  ::view-transition-old(photo),
  ::view-transition-new(photo) {
    animation-duration: 450ms;
    animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  ::view-transition-old(root),
  ::view-transition-new(root) {
    animation-duration: 300ms;
  }

  .lightbox-exif {
    margin: 16px 0 0;
    font-size: 1rem;
    color: #e8e8e8;
    text-align: center;
  }

  .lightbox-exif:empty { display: none; }

  .lightbox-btn {
    position: absolute;
    z-index: 1;
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.35);
    color: #e8e8e8;
    cursor: pointer;
    opacity: 0.75;
    transition: opacity 150ms ease, background-color 150ms ease;
  }

  .lightbox-btn:hover,
  .lightbox-btn:focus-visible {
    opacity: 1;
    background: rgba(0, 0, 0, 0.6);
  }

  .lightbox-btn[hidden] { display: none; }

  .lightbox-btn svg { width: 22px; height: 22px; }

  /* Quiet: clicking the photo or the backdrop closes too, so the x is only
     a hint. */
  .lightbox-close {
    top: 14px;
    right: 14px;
    background: none;
    opacity: 0.35;
  }

  .lightbox-close svg { width: 16px; height: 16px; }

  .lightbox-prev,
  .lightbox-next {
    top: 50%;
    transform: translateY(-50%);
  }

  .lightbox-prev { left: 14px; }
  .lightbox-next { right: 14px; }

  /* Touch screens swipe between photos instead. */
  @media (hover: none) {
    .lightbox-prev,
    .lightbox-next { display: none; }
  }

  body.lightbox-open { overflow: hidden; }

  /* Holding S (or pressing and holding, on a touch screen) steps back into
     the 3D gallery. */
  .stepback-tip { margin-top: 6px; color: #6a6a6a; font-size: 0.78rem; }
  .tip-touch { display: none; }
  @media (hover: none) and (pointer: coarse) {
    .tip-keys { display: none; }
    .tip-touch { display: inline; }
  }
  .stepback-tip kbd {
    font: inherit; padding: 0 5px; border: 1px solid #3a3a3a; border-radius: 4px; color: #9a9a9a;
  }
  .stepback-tip button {
    font: inherit; color: #9a9a9a; background: none; border: 0; padding: 0; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .stepback {
    position: fixed; left: 50%; bottom: 28px; z-index: 40; transform: translateX(-50%);
    padding: 9px 16px 11px; border-radius: 999px; background: rgba(18, 18, 18, 0.86);
    color: #d8d8d8; font-size: 0.8rem; letter-spacing: 0.02em; pointer-events: none; white-space: nowrap;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
  }
  .stepback i {
    position: absolute; left: 16px; right: 16px; bottom: 5px; height: 2px; border-radius: 2px;
    background: #e8e8e8; transform-origin: left; transform: scaleX(var(--p, 0));
  }
  /* Still loading after the hold: the bar stays full and breathes. */
  .stepback.is-waiting i { transform: none; animation: stepback-wait 1.1s ease-in-out infinite; }
  @keyframes stepback-wait { 50% { opacity: 0.25; } }
  .gallery-frame {
    position: fixed; inset: 0; width: 100%; height: 100%; border: 0; z-index: 60;
    opacity: 0; pointer-events: none; transition: opacity 0.35s ease; background: #121212;
  }
  .gallery-frame.is-on { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>

  <header class="site-header">
    <a class="logo" href="./">Steven Guarino <span class="logo-mark">Archive</span></a>
    <nav class="site-nav" id="siteNav">
      <button class="nav-link is-active" type="button" data-filter="all">All</button>
      <button class="nav-link" type="button" data-filter="Wildlife">Wildlife</button>
      <button class="nav-link" type="button" data-filter="Night Sky">Night Sky</button>
      <button class="nav-link" type="button" data-filter="Landscape">Landscape</button>
      <button class="nav-link" type="button" data-filter="Close-Up">Close-Up</button>
      <button class="nav-link" type="button" data-filter="Aviation">Aviation</button>
    </nav>
  </header>

  <main>
    <div class="gallery" id="grid"></div>
  </main>

  <footer class="site-footer">
    <p>Sony a6700 · Sigma 17-40mm f/1.8 · Sigma 150-600mm DG DN Sports</p>
    <p class="stepback-tip"><span class="tip-keys">Hold <kbd>S</kbd> to step back into the gallery</span><span class="tip-touch">Press and hold the page to step back into the gallery</span> · <button type="button" id="stepInside">or step inside</button></p>
  </footer>
  <div class="stepback" id="stepback" hidden>Stepping back…<i></i></div>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <button class="lightbox-btn lightbox-close" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
    </button>
    <button class="lightbox-btn lightbox-prev" type="button" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
    </button>
    <button class="lightbox-btn lightbox-next" type="button" aria-label="Next photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
    </button>
    <div class="lightbox-stage">
      <div class="lightbox-frame">
        <img id="lightbox-img" src="" alt="" />
      </div>
      <p id="lightbox-exif" class="lightbox-exif"></p>
    </div>
  </div>

  <script src="js/photos.js?v=4"></script>
  <script>
    // ---------- Gallery ----------

    // Newest first, but a photo waits while one from the same outing (same
    // category, taken within a few hours) is among the last few placed, and
    // same-category neighbours are avoided when there's a choice. Sorting purely
    // by date lined up near-identical frames from one shoot.
    const OUTING_GAP = 3 * 60 * 60 * 1000;
    const SPREAD = 6; // about a row and a half, so lookalikes don't stack either
    const timeOf = (photo) => (photo.dateTaken ? Date.parse(photo.dateTaken) : 0);
    const sameOuting = (a, b) =>
      a.category === b.category && Math.abs(timeOf(a) - timeOf(b)) <= OUTING_GAP;

    function mixed(photos) {
      const pool = photos.slice().sort((a, b) => timeOf(b) - timeOf(a));
      const out = [];
      while (pool.length) {
        const recent = out.slice(-SPREAD);
        const last = out[out.length - 1];
        const fresh = (photo) => !recent.some((placed) => sameOuting(photo, placed));
        let pick = pool.findIndex((photo) => fresh(photo) && (!last || photo.category !== last.category));
        if (pick === -1) pick = pool.findIndex(fresh);
        if (pick === -1) pick = 0;
        out.push(pool.splice(pick, 1)[0]);
      }
      return out;
    }

    const orderedPhotos = mixed(PHOTOS);

    const grid = document.getElementById("grid");
    const ratioOf = (photo) => (photo.width && photo.height ? photo.width / photo.height : 1.5);

    // The grid loads small copies from photos/thumbs/ (made by
    // tools/make_thumbs.py) sized to each tile; the lightbox still shows the
    // full-size files.
    const THUMB_WIDTHS = [480, 800, 1200]; // keep in sync with tools/make_thumbs.py

    // How much a hovered photo enlarges (1 on touch screens and with reduced
    // motion); see --hover-scale.
    const HOVER_SCALE =
      parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hover-scale")) || 1;

    function gridSrcset(photo) {
      const stem = photo.file.split("/").pop().replace(/\.[^.]+$/, "");
      const sources = THUMB_WIDTHS.map((w) => `photos/thumbs/${stem}-${w}.jpg ${w}w`);
      if (photo.width > THUMB_WIDTHS[THUMB_WIDTHS.length - 1]) {
        sources.push(`${photo.file} ${photo.width}w`);
      }
      return sources.join(", ");
    }

    const tileFor = new Map(); // photo -> its tile, the fixed spot in the grid
    const thumbFor = new Map(); // photo -> the <img> in it
    orderedPhotos.forEach((photo, index) => {
      const tile = document.createElement("div");
      tile.className = "tile";
      const card = document.createElement("div"); // what lifts and tilts on hover
      card.className = "card";

      const img = document.createElement("img");
      img.alt = photo.alt || "";
      if (photo.title) img.title = photo.title;
      if (photo.width && photo.height) {
        img.width = photo.width;
        img.height = photo.height;
      }
      img.loading = index < 6 ? "eager" : "lazy";
      img.decoding = "async";
      img.addEventListener("load", () => img.classList.add("is-loaded"));
      // No thumbnails yet (make_thumbs.py not run): use the full-size files.
      img.addEventListener(
        "error",
        () => {
          img.srcset = photo.file2x ? `${photo.file} 1x, ${photo.file2x} 2x` : "";
          img.src = photo.file;
        },
        { once: true }
      );
      img.sizes = "(max-width: 620px) 100vw, 33vw"; // refined per tile in layout()
      img.srcset = gridSrcset(photo);
      img.src = photo.file;
      img.addEventListener("click", () => openLightbox(photo));
      // Reachable from the keyboard too: Tab to it, Enter or Space opens it.
      img.tabIndex = 0;
      img.setAttribute("role", "button");
      img.addEventListener("keydown", (e) => {
        if (e.key !== "Enter" && e.key !== " ") return;
        e.preventDefault();
        openLightbox(photo);
      });

      card.appendChild(img);
      tile.appendChild(card);
      tileFor.set(photo, tile);
      thumbFor.set(photo, img);
    });

    // Row size follows a repeating pattern of photos-per-row, so the page
    // alternates between bands of two large frames and bands of three or four
    // smaller ones. Fitting rows to target heights instead collapses toward a
    // single height, because most of this set shares one aspect ratio.
    function rowPlanFor(width) {
      if (width < 560) return { pattern: [1, 2, 2], maxH: width * 1.2, minH: width * 0.3 };
      if (width < 860) return { pattern: [1, 2, 2, 3], maxH: width * 0.8, minH: width * 0.2 };
      return { pattern: [2, 3, 2, 4, 3], maxH: width * 0.5, minH: width * 0.14 };
    }

    // Each photo fades and rises in the first time it scrolls into view.
    const revealer = new IntersectionObserver(
      (entries) =>
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          entry.target.classList.add("is-in");
          revealer.unobserve(entry.target);
        }),
      { rootMargin: "0px 0px -6% 0px" }
    );

    // `reveal` replays that fade for a fresh set of photos; a re-layout on
    // resize leaves the ones already showing alone.
    function layout(photos, reveal = false) {
      const width = grid.clientWidth;
      if (!width) return;

      const gap = parseFloat(getComputedStyle(grid).rowGap) || 0;
      const { pattern, maxH, minH } = rowPlanFor(width);

      const heightOf = (slice) => {
        const ratioSum = slice.reduce((sum, photo) => sum + ratioOf(photo), 0);
        return (width - gap * (slice.length - 1)) / ratioSum;
      };

      const rows = [];
      let cursor = 0;

      while (cursor < photos.length) {
        const remaining = photos.length - cursor;
        let count = Math.min(pattern[rows.length % pattern.length], remaining);

        // A run of portraits or panoramas can still tower or squash at the
        // pattern's count, so nudge it until the row sits in range.
        while (count < remaining && heightOf(photos.slice(cursor, cursor + count)) > maxH) count++;
        while (count > 1 && heightOf(photos.slice(cursor, cursor + count)) < minH) count--;

        rows.push(photos.slice(cursor, cursor + count));
        cursor += count;
      }

      // The final row only gets the leftovers, often too few to fill the width.
      // Re-split it with the row above so both fill it, as evenly as possible.
      if (rows.length > 1 && heightOf(rows[rows.length - 1]) > maxH) {
        const pair = rows[rows.length - 2].concat(rows[rows.length - 1]);
        let best = null;
        for (let split = 1; split < pair.length; split++) {
          const a = heightOf(pair.slice(0, split));
          const b = heightOf(pair.slice(split));
          if (Math.max(a, b) > maxH || Math.min(a, b) < minH) continue;
          if (!best || Math.abs(a - b) < best.diff) best = { split, diff: Math.abs(a - b) };
        }
        if (best) rows.splice(-2, 2, pair.slice(0, best.split), pair.slice(best.split));
      }

      // A lone row (a category with only a photo or two) may run a little
      // taller to fill the width; past that it sits at the cap, centred so it
      // reads as deliberate rather than as a row missing a photo.
      const lone = rows.length === 1;
      const cap = lone ? maxH * 1.25 : maxH;

      grid.textContent = "";
      rows.forEach((rowPhotos) => {
        const height = heightOf(rowPhotos);
        const loose = height > cap;

        const row = document.createElement("div");
        row.className = loose && lone ? "gallery-row is-centered" : "gallery-row";
        rowPhotos.forEach((photo, column) => {
          const tile = tileFor.get(photo);
          const tileWidth = (loose ? cap : height) * ratioOf(photo);
          // Photos in a row fade in one after another, left to right.
          tile.style.setProperty("--reveal-delay", `${column * 70}ms`);
          if (reveal) {
            tile.classList.remove("is-in");
            revealer.unobserve(tile);
            revealer.observe(tile);
          }
          if (loose) {
            tile.style.flex = "0 0 auto";
            tile.style.width = `${Math.round(tileWidth)}px`;
          } else {
            tile.style.flex = `${ratioOf(photo)} 1 0%`;
            tile.style.width = "";
          }
          // Lets the browser pick the smallest thumbnail that stays sharp,
          // including when the photo is enlarged on hover.
          thumbFor.get(photo).sizes = `${Math.ceil(tileWidth * HOVER_SCALE)}px`;
          row.appendChild(tile);
        });
        grid.appendChild(row);
      });
    }

    let visiblePhotos = orderedPhotos;

    function showCategory(filter) {
      document
        .querySelectorAll("#siteNav .nav-link")
        .forEach((el) => el.classList.toggle("is-active", el.dataset.filter === filter));

      const swap = () => {
        visiblePhotos =
          filter === "all" ? orderedPhotos : mixed(PHOTOS.filter((p) => p.category === filter));
        layout(visiblePhotos, true);
        grid.classList.remove("is-leaving");
      };

      // Fade the current photos out before the new set fades in.
      clearTimeout(swapTimer);
      const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!grid.childElementCount || still) return swap();
      grid.classList.add("is-leaving");
      swapTimer = setTimeout(swap, 240);
    }

    let swapTimer;

    // The category lives in the URL (#night-sky), so a link can open straight
    // to it and a reload keeps it.
    const slugOf = (filter) => filter.toLowerCase().replace(/[^a-z0-9]+/g, "-");

    function categoryFromHash() {
      const btn = [...document.querySelectorAll("#siteNav .nav-link")].find(
        (el) => slugOf(el.dataset.filter) === location.hash.slice(1)
      );
      return btn ? btn.dataset.filter : "all";
    }

    showCategory(categoryFromHash());

    document.getElementById("siteNav").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-filter]");
      if (!btn) return;

      const filter = btn.dataset.filter;
      const url = filter === "all" ? location.pathname + location.search : `#${slugOf(filter)}`;
      history.replaceState(null, "", url);
      showCategory(filter);
    });

    window.addEventListener("hashchange", () => {
      if (lightboxOpen) closeLightbox();
      showCategory(categoryFromHash());
    });

    let lastWidth = window.innerWidth;
    let resizeTimer;
    window.addEventListener("resize", () => {
      if (window.innerWidth === lastWidth) return;
      lastWidth = window.innerWidth;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => layout(visiblePhotos), 150);
    });

    // ---------- Lightbox ----------

    function formatExif(photo) {
      const parts = [];
      if (photo.aperture) parts.push(photo.aperture);
      if (photo.shutter) parts.push(photo.shutter);
      if (photo.iso) parts.push(`ISO ${photo.iso}`);
      return parts.join(" · ");
    }

    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const lightboxExif = document.getElementById("lightbox-exif");
    const closeBtn = lightbox.querySelector(".lightbox-close");
    const prevBtn = lightbox.querySelector(".lightbox-prev");
    const nextBtn = lightbox.querySelector(".lightbox-next");

    // Index into visiblePhotos, so browsing follows the grid's current order
    // and category.
    let current = 0;

    // Fit the photo inside the viewport, leaving room for the caption. Sizing
    // it up front keeps it steady when the full-size file replaces the
    // grid's copy.
    function fitLightboxImage(photo) {
      const margin = 14;
      const captionSpace = 52;
      const maxW = window.innerWidth - margin * 2;
      const maxH = window.innerHeight - margin * 2 - captionSpace;
      const width = Math.min(maxW, maxH * ratioOf(photo));
      lightboxImg.style.width = `${Math.round(width)}px`;
      lightboxImg.style.height = `${Math.round(width / ratioOf(photo))}px`;
    }

    const fullSrcset = (photo) => (photo.file2x ? `${photo.file} 1x, ${photo.file2x} 2x` : "");

    function showPhoto(index) {
      const count = visiblePhotos.length;
      current = (index + count) % count;
      const photo = visiblePhotos[current];

      fitLightboxImage(photo);
      lightboxImg.alt = photo.alt || "";
      lightboxExif.textContent = formatExif(photo);

      // Show the grid's already-loaded copy straight away, then swap in the
      // full-size file once it's decoded, so there's never a blank frame.
      const thumb = thumbFor.get(photo);
      if (thumb.complete && thumb.currentSrc) {
        lightboxImg.removeAttribute("srcset");
        lightboxImg.src = thumb.currentSrc;
      }
      // The swap waits for the morph to land too: changing the image
      // mid-flight makes the browser redraw it every frame.
      const full = new Image();
      full.srcset = fullSrcset(photo);
      full.src = photo.file;
      Promise.all([full.decode(), morphDone]).then(
        () => {
          if (visiblePhotos[current] !== photo) return; // moved on meanwhile
          if (photo.file2x) lightboxImg.srcset = fullSrcset(photo);
          else lightboxImg.removeAttribute("srcset");
          lightboxImg.src = photo.file;
        },
        () => {} // keep the grid's copy if the full-size file fails
      );

      // Fetch the neighbours so stepping to them is instant, once the morph
      // is done so they don't compete with it.
      const neighbours = [current - 1, current + 1].map((i) => visiblePhotos[(i + count) % count]);
      morphDone.then(() =>
        neighbours.forEach((neighbour) => {
          const preload = new Image();
          preload.srcset = fullSrcset(neighbour);
          preload.src = neighbour.file;
        })
      );
    }

    // Opening and closing morph the photo between its grid tile and the big
    // view: the browser animates between the two elements that take turns
    // carrying the view-transition-name "photo". Without view transitions, or
    // with reduced motion, the viewer just fades.
    const canMorph = () =>
      typeof document.startViewTransition === "function" &&
      !matchMedia("(prefers-reduced-motion: reduce)").matches;

    // A tile scrolled out of view has nothing to fly back to.
    function onScreen(el) {
      const box = el.getBoundingClientRect();
      return box.bottom > 0 && box.top < innerHeight && box.right > 0 && box.left < innerWidth;
    }

    // Morph `from` into `to` while update() changes the page. Only one element
    // may carry the name at a time, so stray names from an interrupted morph
    // are cleared first, and the token stops an interrupted morph's cleanup
    // from wiping the names of the one that replaced it.
    let morphToken = 0;
    let morphDone = Promise.resolve(); // settles when the latest morph lands

    function morph(from, to, update) {
      const token = ++morphToken;
      document
        .querySelectorAll(".gallery img, #lightbox-img")
        .forEach((el) => (el.style.viewTransitionName = ""));
      from.style.viewTransitionName = "photo";

      const transition = document.startViewTransition(() => {
        from.style.viewTransitionName = "";
        to.style.viewTransitionName = "photo";
        // The view transition fades the backdrop; skip the CSS fade.
        lightbox.style.transition = "none";
        update();
      });
      // A morph that gets skipped (another started, or the tab can't animate)
      // rejects `ready`; the page still changes, so that's not an error here.
      transition.ready.catch(() => {});
      morphDone = transition.finished.then(
        () => {},
        () => {}
      );
      morphDone.then(() => {
        if (token !== morphToken) return;
        to.style.viewTransitionName = "";
        lightbox.style.transition = "";
      });
    }

    function openLightbox(photo) {
      const reveal = () => {
        showPhoto(visiblePhotos.indexOf(photo));
        prevBtn.hidden = nextBtn.hidden = visiblePhotos.length < 2;
        lightboxOpen = true;
        lightbox.hidden = false;
        document.body.classList.add("lightbox-open");
      };

      if (canMorph()) {
        morph(thumbFor.get(photo), lightboxImg, () => {
          reveal();
          lightbox.classList.add("is-open");
        });
      } else {
        reveal();
        requestAnimationFrame(() => lightbox.classList.add("is-open"));
      }
      closeBtn.focus({ preventScroll: true });
    }

    let lightboxOpen = false;

    function closeLightbox() {
      lightboxOpen = false;
      const thumb = thumbFor.get(visiblePhotos[current]);
      // Focus goes back to the photo in the grid, so the keyboard picks up
      // where it left off.
      if (lightbox.contains(document.activeElement)) {
        document.activeElement.blur();
        if (thumb?.isConnected) thumb.focus({ preventScroll: true });
      }

      // Fly back into the tile of whichever photo is showing now.
      if (canMorph() && thumb && thumb.isConnected && onScreen(thumb)) {
        morph(lightboxImg, thumb, () => {
          lightbox.classList.remove("is-open");
          lightbox.hidden = true;
          document.body.classList.remove("lightbox-open");
        });
        return;
      }

      lightbox.classList.remove("is-open");
      document.body.classList.remove("lightbox-open");

      // Hide once the fade-out ends. The timer covers a fade that never ran
      // (closed before it started), which would otherwise leave an invisible
      // overlay swallowing clicks; reopening mid-fade cancels the hide.
      const hide = () => {
        clearTimeout(timer);
        lightbox.removeEventListener("transitionend", onEnd);
        if (!lightboxOpen) lightbox.hidden = true;
      };
      const onEnd = (e) => {
        if (e.target === lightbox) hide();
      };
      const timer = setTimeout(hide, 300);
      lightbox.addEventListener("transitionend", onEnd);
    }

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox || e.target === lightbox.querySelector(".lightbox-stage")) {
        closeLightbox();
      }
    });

    closeBtn.addEventListener("click", closeLightbox);
    lightboxImg.addEventListener("click", closeLightbox);
    prevBtn.addEventListener("click", () => showPhoto(current - 1));
    nextBtn.addEventListener("click", () => showPhoto(current + 1));

    document.addEventListener("keydown", (e) => {
      if (!lightboxOpen) return;
      if (e.key === "Escape") closeLightbox();
      else if (e.key === "ArrowRight") showPhoto(current + 1);
      else if (e.key === "ArrowLeft") showPhoto(current - 1);
    });

    // Swipe left/right to move between photos on touch screens. A second
    // finger (pinch-zooming) cancels it.
    const SWIPE_THRESHOLD = 50; // px
    let touchStart = null;

    lightbox.addEventListener(
      "touchstart",
      (e) => {
        touchStart =
          e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
      },
      { passive: true }
    );

    lightbox.addEventListener(
      "touchend",
      (e) => {
        if (!touchStart || e.touches.length) return;
        const dx = e.changedTouches[0].clientX - touchStart.x;
        const dy = e.changedTouches[0].clientY - touchStart.y;
        touchStart = null;
        if (Math.abs(dx) < SWIPE_THRESHOLD || Math.abs(dx) < Math.abs(dy)) return;
        showPhoto(current + (dx < 0 ? 1 : -1));
      },
      { passive: true }
    );

    window.addEventListener("resize", () => {
      if (lightboxOpen) fitLightboxImage(visiblePhotos[current]);
    });

    // ---------- Step back into the gallery ----------
    // Hold S (back, as in the gallery), or press and hold the page on a touch
    // screen, and the page pulls back to become a window on the wall of the
    // 3D gallery's lobby, and you can walk about. The gallery runs in a frame
    // over the page, loaded as soon as a hold gets going so it arrives while
    // you're still holding; we send it a snapshot of what's on screen so its
    // window shows exactly this, then fade the page away once the gallery
    // has drawn it. It hands back when you walk up to the window and press E.
    const GALLERY_URL = "gallery-3d/out/index.html?from=site#from=site";
    const HOLD_MS = 650;
    const stepbackEl = document.getElementById("stepback");
    let galleryFrame = null;
    let galleryReady = null;
    let inGallery = false;
    let hold = null;

    function loadGallery() {
      if (galleryFrame) return galleryReady;
      const frame = (galleryFrame = document.createElement("iframe"));
      frame.className = "gallery-frame";
      frame.title = "3D gallery";
      frame.allow = "autoplay; fullscreen";
      galleryReady = new Promise((res) => {
        addEventListener("message", function ready(e) {
          if (e.source === frame.contentWindow && e.data?.type === "gallery:ready") {
            removeEventListener("message", ready);
            res(frame);
          }
        });
      });
      frame.src = GALLERY_URL;
      document.body.appendChild(frame);
      return galleryReady;
    }

    // On a computer, fetch the gallery's page quietly once this one has
    // settled, so the first step back doesn't wait on the network.
    if (matchMedia("(hover: hover) and (pointer: fine)").matches && !navigator.connection?.saveData) {
      addEventListener("load", () => setTimeout(() => {
        const link = document.createElement("link");
        link.rel = "prefetch";
        link.href = GALLERY_URL.split("#")[0];
        document.head.appendChild(link);
      }, 4000));
    }

    // What's on screen, for the gallery to paint into its window: each
    // visible photo, each line of header and footer text with its font,
    // colour and opacity, and the borders drawn round any of it. The size is
    // the area the frame will cover, which leaves out a classic scrollbar.
    const measure = document.createElement("canvas").getContext("2d");
    function snapshot() {
      const vw = document.documentElement.clientWidth;
      const vh = document.documentElement.clientHeight;
      const onScreen = (r) => r.bottom > 0 && r.top < vh && r.right > 0 && r.left < vw && r.width > 0;
      // How see-through an element is, everything round it included.
      const opacityOf = (el) => {
        let a = 1;
        for (let e = el; e && e !== document.documentElement; e = e.parentElement) a *= parseFloat(getComputedStyle(e).opacity);
        return a;
      };
      const items = [];
      for (const img of document.querySelectorAll("#grid img")) {
        const r = img.getBoundingClientRect();
        if (!onScreen(r)) continue;
        const card = opacityOf(img.parentElement);
        if (card < 0.02) continue;
        items.push({ x: r.left, y: r.top, w: r.width, h: r.height, src: img.currentSrc || img.src, card, alpha: card * parseFloat(getComputedStyle(img).opacity) });
      }
      const texts = [];
      const boxes = [];
      // A text node, a line at a time (footer text wraps on a phone).
      const addText = (node, el) => {
        const words = [...node.textContent.matchAll(/\S+/g)];
        if (!words.length) return;
        const cs = getComputedStyle(el);
        const font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
        const size = parseFloat(cs.fontSize);
        const alpha = opacityOf(el);
        const under = cs.textDecorationLine.includes("underline")
          ? { offset: parseFloat(cs.textUnderlineOffset) || size * 0.12, thick: Math.max(1, parseFloat(cs.textDecorationThickness) || size * 0.06) }
          : null;
        const range = document.createRange();
        let line = null;
        const flush = () => {
          if (!line) return;
          range.setStart(node, line.from);
          range.setEnd(node, line.to);
          const r = range.getBoundingClientRect();
          if (!onScreen(r)) return;
          texts.push({
            text: node.textContent.slice(line.from, line.to), x: r.left, top: r.top, h: r.height, w: r.width,
            base: r.top + (r.height + size * 0.72) / 2, font, color: cs.color, alpha, ls: cs.letterSpacing, under,
          });
        };
        for (const m of words) {
          range.setStart(node, m.index);
          range.setEnd(node, m.index + m[0].length);
          const top = range.getBoundingClientRect().top;
          if (line && Math.abs(top - line.top) < 2) line.to = m.index + m[0].length;
          else {
            flush();
            line = { from: m.index, to: m.index + m[0].length, top };
          }
        }
        flush();
      };
      // Text that CSS puts before an element's own (the slash in the logo):
      // placed once the element's first line is known.
      const addBefore = (el) => {
        const ps = getComputedStyle(el, "::before");
        if (!/^["']/.test(ps.content)) return null;
        const first = texts.length;
        return () => {
          const t = texts[first];
          if (!t) return;
          const text = ps.content.slice(1, -1);
          measure.font = `${ps.fontWeight} ${ps.fontSize} ${ps.fontFamily}`;
          if ("letterSpacing" in measure) measure.letterSpacing = ps.letterSpacing === "normal" ? "0px" : ps.letterSpacing;
          const w = measure.measureText(text).width;
          texts.push({ ...t, text, x: t.x - parseFloat(ps.marginRight) - w, w, font: measure.font, color: ps.color, alpha: t.alpha * parseFloat(ps.opacity), under: null });
        };
      };
      const addBox = (el) => {
        const cs = getComputedStyle(el);
        const sides = ["Top", "Right", "Bottom", "Left"].map((side) => {
          const w = parseFloat(cs[`border${side}Width`]);
          const c = cs[`border${side}Color`];
          return w > 0 && cs[`border${side}Style`] !== "none" && c !== "transparent" && !/,\s*0\)$/.test(c) ? { w, c } : null;
        });
        if (!sides.some(Boolean)) return;
        const r = el.getBoundingClientRect();
        if (onScreen(r)) boxes.push({ x: r.left, y: r.top, w: r.width, h: r.height, radius: parseFloat(cs.borderTopLeftRadius) || 0, sides, alpha: opacityOf(el) });
      };
      const walk = (el) => {
        addBox(el);
        const before = addBefore(el);
        for (const n of el.childNodes) {
          if (n.nodeType === 3) addText(n, el);
          else if (n.nodeType === 1 && getComputedStyle(n).display !== "none") walk(n);
        }
        before?.();
      };
      document.querySelectorAll(".site-header, .site-footer").forEach(walk);
      return { w: vw, h: vh, dpr: window.devicePixelRatio || 1, bg: getComputedStyle(document.body).backgroundColor, items, texts, boxes };
    }

    let loadTimer = 0;
    function openGallery() {
      if (inGallery) return;
      inGallery = true;
      const snap = snapshot();
      stepbackEl.hidden = false;
      stepbackEl.firstChild.textContent = "Stepping back…";
      let ready = false;
      // Still loading once the hold is done: say so, and give up after a
      // while rather than leave the page waiting on nothing.
      requestAnimationFrame(() => {
        if (ready) return;
        stepbackEl.firstChild.textContent = "Loading the gallery…";
        stepbackEl.classList.add("is-waiting");
      });
      clearTimeout(loadTimer);
      loadTimer = setTimeout(() => {
        if (ready) return;
        stepbackEl.firstChild.textContent = "The gallery didn't load. Try again in a moment.";
        stepbackEl.classList.remove("is-waiting");
        galleryFrame?.remove();
        galleryFrame = galleryReady = null;
        setTimeout(() => { inGallery = false; stepbackEl.hidden = true; }, 2600);
      }, 25000);
      loadGallery().then((frame) => {
        ready = true;
        if (frame !== galleryFrame) return;
        stepbackEl.firstChild.textContent = "Stepping back…";
        stepbackEl.classList.remove("is-waiting");
        frame.contentWindow.postMessage({ type: "gallery:enter", snap }, "*");
      });
    }

    addEventListener("message", (e) => {
      if (!galleryFrame || e.source !== galleryFrame.contentWindow) return;
      const type = e.data?.type;
      if (type === "gallery:shown") {
        // The gallery is showing this page in its window, so trade places,
        // then let it pull back.
        galleryFrame.classList.add("is-on");
        stepbackEl.hidden = true;
        setTimeout(() => {
          galleryFrame.focus();
          galleryFrame.contentWindow.focus();
          galleryFrame.contentWindow.postMessage({ type: "gallery:go" }, "*");
        }, 380);
      } else if (type === "gallery:return") {
        galleryFrame.classList.remove("is-on");
        setTimeout(() => {
          galleryFrame.contentWindow.postMessage({ type: "gallery:pause" }, "*");
          inGallery = false;
          window.focus();
        }, 380);
      }
    });

    // A hold fills the little bar; let go early and nothing happens.
    function startHold(label) {
      if (hold || inGallery || lightboxOpen) return;
      const t0 = performance.now();
      stepbackEl.hidden = false;
      stepbackEl.classList.remove("is-waiting");
      stepbackEl.firstChild.textContent = label;
      hold = { raf: 0 };
      const tick = (now) => {
        const p = Math.min(1, (now - t0) / HOLD_MS);
        stepbackEl.style.setProperty("--p", p);
        // Start fetching early enough to overlap the hold, but not on
        // every passing tap.
        if (now - t0 > 200) loadGallery();
        if (p >= 1) { hold = null; openGallery(); return; }
        hold.raf = requestAnimationFrame(tick);
      };
      hold.raf = requestAnimationFrame(tick);
    }
    function endHold() {
      if (!hold) return;
      cancelAnimationFrame(hold.raf);
      hold = null;
      if (!inGallery) stepbackEl.hidden = true;
    }
    addEventListener("keydown", (e) => {
      if (e.code !== "KeyS" || e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.target.closest?.("input, textarea, select")) return;
      startHold("Keep holding S to step back");
    });
    addEventListener("keyup", (e) => { if (e.code === "KeyS") endHold(); });
    addEventListener("blur", endHold);
    // On a touch screen: press and hold anywhere that isn't a photo, a link,
    // a button or a line of text. Moving the finger (a scroll) lets go.
    let press = null;
    const letGo = () => { press = null; endHold(); };
    addEventListener("pointerdown", (e) => {
      if (e.pointerType !== "touch" || e.target.closest("a, button, img, p, .lightbox, .gallery-frame")) return;
      press = { id: e.pointerId, x: e.clientX, y: e.clientY };
      startHold("Keep holding to step back");
    });
    addEventListener("pointermove", (e) => {
      if (press && e.pointerId === press.id && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) letGo();
    });
    addEventListener("pointerup", (e) => { if (press && e.pointerId === press.id) letGo(); });
    addEventListener("pointercancel", (e) => { if (press && e.pointerId === press.id) letGo(); });
    addEventListener("scroll", () => { if (press) letGo(); }, { passive: true });
    addEventListener("contextmenu", (e) => { if (press) e.preventDefault(); });
    document.getElementById("stepInside").addEventListener("click", openGallery);
    window.__gallery = { snapshot, frame: () => galleryFrame }; // for tests

  </script>
</body>
</html>
