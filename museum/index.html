<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --bg: #07080c;
    --ink: #f1e7d6;
    --dim: rgba(241, 231, 214, 0.62);
    --faint: rgba(241, 231, 214, 0.38);
    --panel: rgba(10, 10, 14, 0.72);
    --line: rgba(241, 231, 214, 0.14);
    --brass: #c9a35a;
  }
  /* The gallery is always at night: the same tokens in either theme. */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #07080c; --ink: #f1e7d6; } }
  :root[data-theme="dark"] { --bg: #07080c; --ink: #f1e7d6; }

  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; outline: none; }
  canvas.pixel { image-rendering: pixelated; }
  .serif { font-family: "Cormorant Garamond", Georgia, serif; }

  #intro { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; text-align: center; padding: 24px;
    background: radial-gradient(ellipse at 50% 60%, rgba(20, 24, 40, 0.55), rgba(5, 6, 9, 0.94) 70%); transition: opacity 600ms ease; }
  #intro.gone { opacity: 0; pointer-events: none; }
  #intro h1 { margin: 0; font: 600 clamp(40px, 8vw, 76px)/1 "Cormorant Garamond", Georgia, serif; letter-spacing: 0.02em; }
  #intro p { margin: 14px 0 30px; color: var(--dim); font: italic 500 clamp(17px, 2.6vw, 22px)/1.4 "Cormorant Garamond", Georgia, serif; }
  #intro button { font: 500 14px/1 Inter, sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink);
    background: transparent; border: 1px solid var(--line); padding: 14px 26px; border-radius: 2px; cursor: pointer; }
  #intro button:hover, #intro button:focus-visible { border-color: var(--brass); color: #fff; outline: none; }
  #intro small { display: block; margin-top: 22px; color: var(--faint); font-size: 12px; letter-spacing: 0.04em; }

  .hud { position: fixed; z-index: 10; pointer-events: none; }
  #name { top: 18px; left: 20px; font: 600 20px/1 "Cormorant Garamond", Georgia, serif; letter-spacing: 0.03em; color: var(--dim); }
  #styles { top: 14px; right: 14px; display: flex; gap: 6px; pointer-events: auto; }
  #styles button { font: 500 12px/1 Inter, sans-serif; color: var(--dim); background: var(--panel); border: 1px solid var(--line);
    padding: 8px 10px; border-radius: 2px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #styles button[aria-pressed="true"] { color: var(--ink); border-color: var(--brass); }
  #styles button kbd { font: inherit; opacity: 0.55; margin-right: 6px; }
  #fps { bottom: 18px; right: 16px; font: 11px ui-monospace, monospace; color: var(--faint); }
  #hint { bottom: 18px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--faint); letter-spacing: 0.03em;
    white-space: nowrap; transition: opacity 400ms ease; }
  #dot { top: 50%; left: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: rgba(241, 231, 214, 0.55); }
  #card { left: 20px; bottom: 20px; max-width: min(360px, calc(100vw - 40px)); padding: 14px 16px 13px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 2px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    opacity: 0; transform: translateY(6px); transition: opacity 260ms ease, transform 260ms ease; }
  #card.on { opacity: 1; transform: none; }
  #card h2 { margin: 0 0 4px; font: 600 22px/1.1 "Cormorant Garamond", Georgia, serif; }
  #card .meta { font-size: 12px; color: var(--dim); }
  #card .exif { font-size: 11px; color: var(--faint); margin-top: 3px; }
  #card .how { font-size: 11px; color: var(--brass); margin-top: 8px; letter-spacing: 0.04em; }
  #viewer { position: fixed; inset: 0; z-index: 40; display: none; place-items: center; background: rgba(4, 4, 6, 0.96); cursor: zoom-out; }
  #viewer.on { display: grid; }
  #viewer img { max-width: 94vw; max-height: 88vh; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); }
  #viewer p { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center; margin: 0; color: var(--dim); font: italic 500 18px/1.2 "Cormorant Garamond", Georgia, serif; }
  @media (max-width: 640px) {
    #hint { white-space: normal; text-align: center; width: calc(100vw - 32px); }
    #styles button kbd { display: none; }
    #name { font-size: 17px; }
  }
</style>

<script type="module">
import * as THREE from "three";
import { Reflector } from "three/addons/objects/Reflector.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

// ---------- The Night Gallery ----------
// One long, tall hall of a museum after closing, built the way the old
// grid shooters were: straight walls, chunky pixel textures, flat sprite
// plants. Moonlight falls through a skylight in stripes; each photograph
// has its own warm picture light; two archways lead off into the dark.
// 1, 2, 3 switch between three looks while we settle on one.

const ROOT = document.querySelector('meta[name="photo-root"]')?.content ?? "../";
const TOUCH = matchMedia("(pointer: coarse)").matches;
const $ = (id) => document.getElementById(id);

// The hall: x across (-8..8), z along (0 at the doors, 48 at the far end).
// Everything is mirrored about the middle (x = 0); the archways are at the
// hall's half-way point.
const HW = 12; // half width
const LEN = 72;
const WALL = 10; // to the cornice
const CEIL = 16;
const PILASTERS = Array.from({ length: 12 }, (_, i) => 3 + i * 6);
const BAYS = Array.from({ length: 11 }, (_, i) => 6 + i * 6);
const MID = LEN / 2;
const ARCH = { z0: MID - 1.8, z1: MID + 1.8, h: 7 };
// The high windows: one tall one in every bay, a wide one in each end wall.
const WY = 13.35; // their middle
const WH = 4; // height
const WW = 3.6; // width
const EW = 7.2; // the end walls' width
const WIN0 = WY - WH / 2;
const WIN1 = WY + WH / 2;
const EYE = 1.65;

// ---------- Renderer, scene, camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, stencil: true, powerPreference: "high-performance" });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap; // soft-edged, so moonlit and dark blend
renderer.shadowMap.autoUpdate = false;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.prepend(renderer.domElement);
const canvas = renderer.domElement;
canvas.tabIndex = 0;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07080c);
scene.fog = new THREE.FogExp2(0x090b14, 0.017);
const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.05, 200);
camera.rotation.order = "YXZ";

// ---------- Pixel textures ----------
// Small canvases drawn a pixel at a time and shown without smoothing: the
// grid-shooter look. Each repeats every `size` metres of wall.
function rng(seed) {
  let s = seed >>> 0;
  return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
}
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function pixelTex(w, h, draw, { repeat = true, srgb = true } = {}) {
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;
  const g = c.getContext("2d");
  g.imageSmoothingEnabled = false;
  draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.anisotropy = Math.min(8, maxAniso);
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const hex = (c) => `#${c.toString(16).padStart(6, "0")}`;
const shade = (c, k) => {
  const r = Math.min(255, Math.max(0, ((c >> 16) & 255) * k));
  const g = Math.min(255, Math.max(0, ((c >> 8) & 255) * k));
  const b = Math.min(255, Math.max(0, (c & 255) * k));
  return `rgb(${r | 0}, ${g | 0}, ${b | 0})`;
};
function speckle(g, w, h, base, amount, seed) {
  const r = rng(seed);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    g.fillStyle = shade(base, 1 + (r() - 0.5) * amount);
    g.fillRect(x, y, 1, 1);
  }
}

const T = {
  // Marble checkerboard: two 2 m tiles each way.
  floor: pixelTex(64, 64, (g) => {
    const r = rng(11);
    for (let ty = 0; ty < 2; ty++) for (let tx = 0; tx < 2; tx++) {
      const dark = (tx + ty) % 2 === 0;
      const base = dark ? 0x1b1d20 : 0x6b655c;
      for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) {
        g.fillStyle = shade(base, 1 + (r() - 0.5) * 0.12);
        g.fillRect(tx * 32 + x, ty * 32 + y, 1, 1);
      }
      // Veins wandering across the slab.
      for (let v = 0; v < 3; v++) {
        let x = r() * 32;
        let y = r() * 32;
        const dx = (r() - 0.5) * 1.6;
        for (let k = 0; k < 40; k++) {
          x += dx + (r() - 0.5);
          y += 0.7;
          if (x < 0 || x > 31 || y > 31) break;
          g.fillStyle = shade(base, dark ? 1.9 : 0.78);
          g.fillRect(tx * 32 + (x | 0), ty * 32 + (y | 0), 1, 1);
        }
      }
      g.fillStyle = "#0d0d0e";
      g.fillRect(tx * 32, ty * 32, 32, 1);
      g.fillRect(tx * 32, ty * 32, 1, 32);
    }
  }),
  // Oxblood silk with a diamond damask.
  silk: pixelTex(32, 32, (g) => {
    speckle(g, 32, 32, 0x4b1b1e, 0.08, 21);
    for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) {
      const a = (x + y) % 16;
      const b = (x - y + 32) % 16;
      if (a === 0 || b === 0) { g.fillStyle = "#5b2427"; g.fillRect(x, y, 1, 1); }
    }
    for (const [cx, cy] of [[8, 0], [0, 8], [8, 16], [24, 16], [16, 8], [16, 24], [24, 0], [0, 24], [8, 32], [24, 32]]) {
      g.fillStyle = "#64292c";
      g.fillRect(cx - 1, cy - 2, 2, 4);
      g.fillRect(cx - 2, cy - 1, 4, 2);
    }
  }),
  // Walnut wainscot: a raised panel with its moulding.
  wood: pixelTex(64, 40, (g) => {
    const r = rng(31);
    for (let y = 0; y < 40; y++) {
      const band = 1 + Math.sin(y * 0.9 + r() * 0.5) * 0.06;
      for (let x = 0; x < 64; x++) {
        g.fillStyle = shade(0x3a2417, band + (r() - 0.5) * 0.1);
        g.fillRect(x, y, 1, 1);
      }
    }
    g.fillStyle = "#24160e";
    g.fillRect(6, 7, 52, 1);
    g.fillRect(6, 7, 1, 26);
    g.fillStyle = "#57391f";
    g.fillRect(6, 33, 53, 1);
    g.fillRect(58, 7, 1, 27);
    g.fillStyle = "#1b100a";
    g.fillRect(0, 39, 64, 1);
    g.fillRect(0, 0, 64, 1);
  }),
  // Limestone pilaster: fluting, a capital at the top, a plinth below.
  stone: pixelTex(16, 128, (g) => {
    speckle(g, 16, 128, 0xb9b09c, 0.1, 41);
    g.fillStyle = "#8f8775";
    for (let x = 2; x < 16; x += 4) g.fillRect(x, 16, 1, 98);
    g.fillStyle = "#d6cdb8";
    for (let x = 3; x < 16; x += 4) g.fillRect(x, 16, 1, 98);
    g.fillStyle = "#7c7564";
    g.fillRect(0, 12, 16, 1);
    g.fillRect(0, 115, 16, 1);
    g.fillRect(0, 4, 16, 1);
  }),
  plain: pixelTex(16, 16, (g) => speckle(g, 16, 16, 0xb3aa96, 0.1, 43)),
  // Cornice: mouldings and a row of dentils.
  cornice: pixelTex(32, 12, (g) => {
    speckle(g, 32, 12, 0xb3aa96, 0.08, 51);
    g.fillStyle = "#7a7363";
    g.fillRect(0, 2, 32, 1);
    g.fillRect(0, 9, 32, 1);
    g.fillStyle = "#cfc6b0";
    for (let x = 0; x < 32; x += 4) g.fillRect(x, 4, 2, 3);
  }),
  plaster: pixelTex(32, 32, (g) => speckle(g, 32, 32, 0x24252c, 0.12, 61)),
  // Coffered ceiling: sunk panels with a gilt edge.
  coffer: pixelTex(32, 32, (g) => {
    speckle(g, 32, 32, 0x1d1b1c, 0.1, 71);
    g.fillStyle = "#121111";
    g.fillRect(4, 4, 24, 24);
    g.fillStyle = "#5a4524";
    g.fillRect(4, 4, 24, 1);
    g.fillRect(4, 4, 1, 24);
    g.fillRect(4, 27, 24, 1);
    g.fillRect(27, 4, 1, 24);
  }),
  darkwood: pixelTex(16, 16, (g) => speckle(g, 16, 16, 0x221610, 0.15, 81)),
  gold: pixelTex(16, 16, (g) => {
    speckle(g, 16, 16, 0x8c6a2e, 0.18, 91);
    g.fillStyle = "#c79c4a";
    g.fillRect(0, 0, 16, 1);
    g.fillRect(0, 0, 1, 16);
    g.fillStyle = "#5c4419";
    g.fillRect(0, 15, 16, 1);
    g.fillRect(15, 0, 1, 16);
  }),
  leather: pixelTex(16, 16, (g) => {
    speckle(g, 16, 16, 0x3a1f17, 0.14, 101);
    g.fillStyle = "#1f100b";
    for (const [x, y] of [[3, 3], [11, 3], [7, 8], [3, 13], [11, 13]]) g.fillRect(x, y, 1, 1);
  }),
  // Night sky for the skylight and the high windows.
  sky: pixelTex(32, 32, (g) => {
    for (let y = 0; y < 32; y++) {
      g.fillStyle = `rgb(${10 + y * 0.4 | 0}, ${16 + y * 0.6 | 0}, ${38 + y * 1.2 | 0})`;
      g.fillRect(0, y, 32, 1);
    }
    const r = rng(111);
    for (let i = 0; i < 9; i++) {
      g.fillStyle = r() < 0.3 ? "#cdd8ff" : "#7d8bb8";
      g.fillRect(r() * 32 | 0, r() * 32 | 0, 1, 1);
    }
  }),
};
// High windows: just the glazing bars; the sky is far off beyond them.
T.window = pixelTex(32, 26, (g) => {
  g.clearRect(0, 0, 32, 26);
  g.fillStyle = "#0b0b0f";
  for (const x of [0, 10, 21, 31]) g.fillRect(x, 0, 1, 26);
  for (const y of [0, 8, 17, 25]) g.fillRect(0, y, 32, 1);
}, { repeat: false });
// Other floors and walls to try (the pickers at the top right).
T.slate = pixelTex(64, 64, (g) => {
  const r = rng(171);
  for (let ty = 0; ty < 2; ty++) for (let tx = 0; tx < 2; tx++) {
    const k = 0.9 + r() * 0.2;
    for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) {
      g.fillStyle = shade(0x2b2d30, k * (1 + (r() - 0.5) * 0.06));
      g.fillRect(tx * 32 + x, ty * 32 + y, 1, 1);
    }
    for (let m = 0; m < 7; m++) { g.fillStyle = shade(0x2b2d30, k * 1.14); g.fillRect(tx * 32 + (r() * 30 | 0), ty * 32 + (r() * 31 | 0), 2, 1); }
    g.fillStyle = "#111214";
    g.fillRect(tx * 32, ty * 32, 32, 1);
    g.fillRect(tx * 32, ty * 32, 1, 32);
  }
});
// Oak laid in a chevron: 1 m planks, a hand's width wide.
T.oak = pixelTex(64, 64, (g) => {
  const shadeOf = new Map();
  const r = rng(181);
  for (let y = 0; y < 64; y++) for (let x = 0; x < 64; x++) {
    const c = Math.floor(x / 16);
    const lx = x % 16;
    const lift = Math.floor((c % 2 ? lx : 15 - lx) / 2);
    const row = y + lift;
    const id = c * 1000 + Math.floor(row / 4);
    if (!shadeOf.has(id)) shadeOf.set(id, 0.8 + r() * 0.35);
    const seam = row % 4 === 0 || lx === 0;
    g.fillStyle = seam ? "#2a1a0e" : shade(0x6b4a2c, shadeOf.get(id) * (1 + (r() - 0.5) * 0.08));
    g.fillRect(x, y, 1, 1);
  }
});
T.navy = pixelTex(32, 32, (g) => {
  speckle(g, 32, 32, 0x1c2434, 0.07, 191);
  const r = rng(193);
  for (let i = 0; i < 10; i++) { g.fillStyle = "rgba(255,255,255,0.025)"; g.fillRect(r() * 32 | 0, 0, 1, 32); }
});
T.green = pixelTex(32, 32, (g) => {
  speckle(g, 32, 32, 0x2b392c, 0.06, 201);
  for (let y = 0; y < 32; y++) for (let x = (y % 2); x < 32; x += 2) { g.fillStyle = "rgba(255,255,255,0.03)"; g.fillRect(x, y, 1, 1); }
});
// Dressed stone in courses: half-metre blocks, the old grid-shooter wall.
T.ashlar = pixelTex(32, 32, (g) => {
  const r = rng(211);
  for (let row = 0; row < 4; row++) for (let b = -1; b < 2; b++) {
    const x0 = b * 16 + (row % 2) * 8;
    const k = 0.85 + r() * 0.25;
    for (let y = row * 8; y < row * 8 + 8; y++) for (let x = x0; x < x0 + 16; x++) {
      if (x < 0 || x > 31) continue;
      const edge = y === row * 8 || x === x0;
      g.fillStyle = edge ? "#2c2a26" : shade(0x6a665e, k * (1 + (r() - 0.5) * 0.1));
      g.fillRect(x, y, 1, 1);
    }
  }
});
T.moon = pixelTex(16, 16, (g) => {
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const d = Math.hypot(x - 7.5, y - 7.5);
    if (d > 7) continue;
    g.fillStyle = d > 6 ? "#b9c3e6" : (x + y * 3) % 11 === 0 ? "#c9d1ee" : "#e9edfb";
    g.fillRect(x, y, 1, 1);
  }
}, { repeat: false });
// Soft round glow, smooth on purpose (light, not a surface).
function glowTex(warm = true) {
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, "rgba(255,255,255,1)");
  grad.addColorStop(0.35, "rgba(255,255,255,0.45)");
  grad.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grad;
  g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const GLOW = glowTex();
// The wash a picture light throws on the wall: brightest just above the
// frame, falling away below.
const WASH = (() => {
  const c = document.createElement("canvas");
  c.width = 128;
  c.height = 128;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(64, 34, 2, 64, 54, 70);
  grad.addColorStop(0, "rgba(255,255,255,1)");
  grad.addColorStop(0.5, "rgba(255,255,255,0.35)");
  grad.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grad;
  g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

// ---------- Building ----------
// Effects go around the photographs, never over them: each photo marks its
// pixels, and haze, dust, beams and glows leave marked pixels alone.
const MARK = { stencilWrite: true, stencilRef: 1, stencilFunc: THREE.AlwaysStencilFunc, stencilZPass: THREE.ReplaceStencilOp };
const SPARE = { stencilWrite: true, stencilRef: 1, stencilFunc: THREE.NotEqualStencilFunc, stencilZPass: THREE.KeepStencilOp, stencilFail: THREE.KeepStencilOp };
const M = {
  silk: new THREE.MeshStandardMaterial({ map: T.silk, roughness: 0.95 }),
  wood: new THREE.MeshStandardMaterial({ map: T.wood, roughness: 0.7 }),
  stone: new THREE.MeshStandardMaterial({ map: T.stone, roughness: 0.85 }),
  plain: new THREE.MeshStandardMaterial({ map: T.plain, roughness: 0.85 }),
  cornice: new THREE.MeshStandardMaterial({ map: T.cornice, roughness: 0.85 }),
  plaster: new THREE.MeshStandardMaterial({ map: T.plaster, roughness: 1 }),
  coffer: new THREE.MeshStandardMaterial({ map: T.coffer, roughness: 1 }),
  darkwood: new THREE.MeshStandardMaterial({ map: T.darkwood, roughness: 0.8 }),
  gold: new THREE.MeshStandardMaterial({ map: T.gold, roughness: 0.45, metalness: 0.6 }),

// Everything that never moves is gathered by material and drawn as one
// mesh per material.
const bins = new Map();
const tmpM = new THREE.Matrix4();
const tmpQ = new THREE.Quaternion();
const tmpE = new THREE.Euler();
function put(geo, mat, { x = 0, y = 0, z = 0, rx = 0, ry = 0, cast = false } = {}) {
  geo.applyMatrix4(tmpM.compose(new THREE.Vector3(x, y, z), tmpQ.setFromEuler(tmpE.set(rx, ry, 0)), new THREE.Vector3(1, 1, 1)));
  const key = mat.uuid + (cast ? "+" : "");
  if (!bins.has(key)) bins.set(key, { mat, cast, list: [] });
  bins.get(key).list.push(geo);
}
function flush() {
  for (const { mat, cast, list } of bins.values()) {
    const mesh = new THREE.Mesh(mergeGeometries(list), mat);
    mesh.castShadow = cast;
    // Only the floor takes the moon's shadows: on the walls the light only
    // grazes, which shows as flicker.
    mesh.receiveShadow = false;
    scene.add(mesh);
  }
  bins.clear();
}
// A plane whose texture repeats every tw x th metres.
function plane(w, h, tw = w, th = h) {
  const g = new THREE.PlaneGeometry(w, h);
  const uv = g.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, (uv.getX(i) * w) / tw, (uv.getY(i) * h) / th);
  return g;
}
// A box textured the same way on every face.
function box(w, h, d, tw = 1, th = 1) {
  const g = new THREE.BoxGeometry(w, h, d);
  const uv = g.attributes.uv;
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++) {
    const i = f * 4 + k;
    uv.setXY(i, (uv.getX(i) * dims[f][0]) / tw, (uv.getY(i) * dims[f][1]) / th);
  }
  return g;
}

}

// A night guard doing his rounds, never quite met: out of the left-hand
// passage, down the left side, across the far end in front of the Osprey,
// back up the right and away down the right-hand passage, then a long wait,
// and the same route back. All you see is his torch; all you hear, his
// steps and keys. Come too close and he turns back the way he came.
const GUARD_PATH = [[-HW - 8.4, MID], [-HW - 0.2, MID], [-HW + 2.6, MID + 1.6], [-HW + 2.6, LEN - 5.5], [HW - 2.6, LEN - 5.5], [HW - 2.6, MID + 1.6], [HW + 0.2, MID], [HW + 8.4, MID]].map(([x, z]) => new THREE.Vector2(x, z));
const guardLen = [0];
for (let i = 1; i < GUARD_PATH.length; i++) guardLen.push(guardLen[i - 1] + GUARD_PATH[i].distanceTo(GUARD_PATH[i - 1]));

function guardAt(sv, out) {
  let i = 1;
  while (i < guardLen.length - 1 && guardLen[i] < sv) i++;
  const a = GUARD_PATH[i - 1];
  const b = GUARD_PATH[i];
  const k = THREE.MathUtils.clamp((sv - guardLen[i - 1]) / (guardLen[i] - guardLen[i - 1]), 0, 1);
  out.set(a.x + (b.x - a.x) * k, 1.3, a.y + (b.y - a.y) * k);
  return Math.atan2(b.x - a.x, b.y - a.y);
}

const guardSteps = []; // listeners for his footsteps (the sound)
function stepGuard(t, dt) {
  const you = new THREE.Vector2(me.x, me.z);
  if (guard.wait > 0) {
    guard.wait -= dt;
    guard.on = Math.max(0, guard.on - dt * 2);
  } else {
    // Too close: turn back (not more than once every few seconds).
    guard.turned -= dt;
    const ahead = new THREE.Vector3();
    guardAt(guard.s + guard.dir * 2, ahead);
    if (guard.turned <= 0 && you.distanceTo(new THREE.Vector2(guard.pos.x, guard.pos.z)) < 9 && you.distanceTo(new THREE.Vector2(ahead.x, ahead.z)) < you.distanceTo(new THREE.Vector2(guard.pos.x, guard.pos.z))) {
      guard.dir *= -1;
      guard.turned = 6;
    }
    guard.s += guard.dir * 1.05 * dt;
    if (guard.s <= 0 || guard.s >= guardLen[guardLen.length - 1]) {
      guard.s = THREE.MathUtils.clamp(guard.s, 0, guardLen[guardLen.length - 1]);
      guard.dir *= -1;
      guard.wait = 25 + Math.random() * 25;
    }
    guard.on = Math.min(1, guard.on + dt * 2);
    guard.step += dt;
    if (guard.step > 0.62) {
      guard.step = 0;
      guardSteps.forEach((f) => f(guard.pos));
    }
  }
  const head = guardAt(guard.s, guard.pos) + (guard.dir < 0 ? Math.PI : 0);
  guard.heading += Math.atan2(Math.sin(head - guard.heading), Math.cos(head - guard.heading)) * Math.min(1, dt * 2.5);
  // The torch wanders: along the floor ahead, over the walls, now and then
  // up at a picture.
  const yaw = guard.heading + Math.sin(t * 0.45) * 0.65 + Math.sin(t * 1.3) * 0.12;
  const pitch = -0.32 + Math.sin(t * 0.31 + 1) * 0.18;
  guard.aim.set(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch));
  torch.position.copy(guard.pos);
  torch.target.position.copy(guard.pos).addScaledVector(guard.aim, 6);
  torch.intensity = 70 * guard.on;
  beam.position.copy(guard.pos);
  beam.lookAt(torch.target.position);
  beamMat.opacity = 0.055 * guard.on;
  // The lens shows when it's turned your way.
  const toYou = camera.position.clone().sub(guard.pos).normalize();
  lens.position.copy(guard.pos).addScaledVector(guard.aim, 0.1);
  lens.material.opacity = guard.on * THREE.MathUtils.smoothstep(toYou.dot(guard.aim), 0.75, 0.97);
  const u = mistMat.uniforms;
  u.uGuardPos.value.copy(guard.pos);
  u.uGuardDir.value.copy(guard.aim);
  u.uGuardOn.value = guard.on;
}

// ---------- The mist ----------
// A real volume of mist lying along the floor. The room is drawn as usual;
// a quick depth-only pass says how far away each pixel is; then, for every
// pixel, the ray from your eye to whatever it meets is marched through the
// mist layer, gathering light (a cool haze, the moonbeams where they come
// down through the skylight, striped by its beams, the warm glow of the
// picture lights and lamps) and dimming what lies behind. Its shape is two
// sizes of 3D noise drifting slowly down the hall. It's laid over the room
// everywhere but the photos (they're marked, like for the other effects).
const MIST_TOP = 1.5; // metres: knee-deep, gone by here
const noise3D = (() => {
  const N = 64;
  const data = new Uint8Array(N * N * N);
  // Smooth value noise that repeats every N voxels, at three sizes.

    g.gain.linearRampToValueAtTime(0.09, t + 3);
    g.gain.linearRampToValueAtTime(0, t + 7.5);
    const pan = ctx.createStereoPanner();
    pan.pan.setValueAtTime(-0.8 * dir, t);
    pan.pan.linearRampToValueAtTime(0.8 * dir, t + 7);
    src.connect(f).connect(g).connect(pan).connect(master);
    g.connect(hall);
    src.start(t);
    src.stop(t + 8);
  });
  // The guard: heavy heels, and now and then his keys.
  guardSteps.push((p) => {
    const t = ctx.currentTime;
    const out = placed(p.x, 0.2, p.z, 2.5);
    const src = ctx.createBufferSource();
    src.buffer = noise;
    const f = ctx.createBiquadFilter();
    f.type = "bandpass";
    f.frequency.value = 900 + Math.random() * 300;
    f.Q.value = 1.6;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.5, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    src.connect(f).connect(g);
    g.connect(out);
    g.connect(hall);
    src.start(t, Math.random() * 1.5, 0.15);
    if (Math.random() < 0.18) {
      for (let k = 0; k < 6; k++) {
        const kt = t + 0.05 + k * (0.03 + Math.random() * 0.05);
        const ks = ctx.createBufferSource();
        ks.buffer = noise;
        const kf = ctx.createBiquadFilter();
        kf.type = "bandpass";
        kf.frequency.value = 4200 + Math.random() * 1800;
        kf.Q.value = 9;
        const kg = ctx.createGain();
        kg.gain.setValueAtTime(0.12, kt);
        kg.gain.exponentialRampToValueAtTime(0.001, kt + 0.06);
        ks.connect(kf).connect(kg).connect(out);
        ks.start(kt, Math.random() * 1.5, 0.08);
      }
    }
  });
  // The building settling: a low creak, once in a while.
  const creak = () => {
    if (ctx.state === "running") {
      const t = ctx.currentTime;
      const src = ctx.createBufferSource();
      src.buffer = noise;
      const f = ctx.createBiquadFilter();
      f.type = "bandpass";
      f.Q.value = 9;
      f.frequency.setValueAtTime(180 + Math.random() * 120, t);
      f.frequency.linearRampToValueAtTime(120 + Math.random() * 60, t + 1.4);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.18, t + 0.3);
      g.gain.linearRampToValueAtTime(0, t + 1.5);
      src.connect(f).connect(g);
      g.connect(hall);
      src.start(t, Math.random(), 1.6);
    }
    setTimeout(creak, 18000 + Math.random() * 26000);
  };
  setTimeout(creak, 9000);
  // A tall clock ticking somewhere down the hall: heard mostly as echo.
  let next = ctx.currentTime + 0.5;
  let tock = false;
  setInterval(() => {
    while (next < ctx.currentTime + 0.6) {
      const src = ctx.createBufferSource();
      src.buffer = noise;
      const f = ctx.createBiquadFilter();
      f.type = "bandpass";
      f.frequency.value = tock ? 1300 : 1700;
      f.Q.value = 8;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, next);
      g.gain.linearRampToValueAtTime(0.05, next + 0.002);
      g.gain.exponentialRampToValueAtTime(0.0005, next + 0.05);
      src.connect(f).connect(g);
      g.connect(hall);
      const dry = ctx.createGain();
      dry.gain.value = 0.25;
      g.connect(dry).connect(master);
      src.start(next, Math.random(), 0.06);
      next += 1;
      tock = !tock;
    }
  }, 250);
  return ctx.resume();
}
function footstep(run) {
  if (!audio || audio.ctx.state !== "running") return;
  const { ctx, noise, master, hall } = audio;
  const t = ctx.currentTime;
  const src = ctx.createBufferSource();
  src.buffer = noise;
  const f = ctx.createBiquadFilter();
  f.type = "bandpass";
  f.frequency.value = 1500 + Math.random() * 500;
  f.Q.value = 1.4;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(run ? 0.16 : 0.11, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0005, t + 0.09);
  src.connect(f).connect(g);
  g.connect(master);
  g.connect(hall);
  src.start(t, Math.random() * 1.5, 0.12);
}

// ---------- You ----------
const me = { x: 0, z: 2.6, yaw: Math.PI, pitch: 0.04, stride: 0, vx: 0, vz: 0 };
const R = 0.3;
let running = false;
let locked = false;
const keys = new Set();
const stick = { x: 0, y: 0 };
function collide() {
  me.x = THREE.MathUtils.clamp(me.x, -HW + R + 0.05, HW - R - 0.05);
  me.z = THREE.MathUtils.clamp(me.z, 0.35 + R, LEN - 0.3 - R);
  for (const b of blockers) {
    const cx = THREE.MathUtils.clamp(me.x, b.x0, b.x1);
    const cz = THREE.MathUtils.clamp(me.z, b.z0, b.z1);
    const dx = me.x - cx;
    const dz = me.z - cz;
    const d = Math.hypot(dx, dz);
    if (d >= R) continue;
    if (d > 1e-5) { me.x = cx + (dx / d) * R; me.z = cz + (dz / d) * R; }
    else {
      // Inside: out by the nearest side.
      const opts = [[b.x0 - R - me.x, 0], [b.x1 + R - me.x, 0], [0, b.z0 - R - me.z], [0, b.z1 + R - me.z]];
      opts.sort((p, q) => Math.hypot(...p) - Math.hypot(...q));
      me.x += opts[0][0];
      me.z += opts[0][1];
    }
  }
}
function walk(dt) {
  let mx = (keys.has("KeyD") || keys.has("ArrowRight") ? 1 : 0) - (keys.has("KeyA") || keys.has("ArrowLeft") ? 1 : 0) + stick.x;
  let mz = (keys.has("KeyW") || keys.has("ArrowUp") ? 1 : 0) - (keys.has("KeyS") || keys.has("ArrowDown") ? 1 : 0) + stick.y;
  const l = Math.hypot(mx, mz);
  if (l > 1) { mx /= l; mz /= l; }
  const run = keys.has("ShiftLeft") || keys.has("ShiftRight");
  const speed = run ? 4.4 : 2.3;
  const sin = Math.sin(me.yaw);
  const cos = Math.cos(me.yaw);
  const tx = (mx * cos - mz * sin) * speed;
  const tz = (-mx * sin - mz * cos) * speed;
  // Ease in and out rather than snapping to speed.
  const k = 1 - Math.exp(-dt * 10);
  me.vx += (tx - me.vx) * k;
  me.vz += (tz - me.vz) * k;
  const steps = Math.max(1, Math.ceil(Math.hypot(me.vx, me.vz) * dt / 0.1));
  for (let i = 0; i < steps; i++) {
    me.x += (me.vx * dt) / steps;
    me.z += (me.vz * dt) / steps;
    collide();
  }
  const moved = Math.hypot(me.vx, me.vz) * dt;
  const before = Math.floor(me.stride / 0.85);
  me.stride += moved;
  if (Math.floor(me.stride / 0.85) !== before && moved > 0.001) footstep(run);
}

// ---------- Input ----------
addEventListener("keydown", (e) => {
  if (e.code === "Escape" && viewer.classList.contains("on")) return closeViewer();
  if (!running) return;
  if (viewer.classList.contains("on")) { if (e.code === "KeyF" || e.code === "Enter" || e.code === "Space") closeViewer(); return; }
  keys.add(e.code);
  if (e.code === "Digit1") applyStyle("sleek");
  if (e.code === "Digit2") applyStyle("retro");
  if (e.code === "Digit3") applyStyle("between");
  if (e.code === "KeyG") $("floorBtn").click();
  if (e.code === "KeyV") $("wallBtn").click();
  if (e.code === "KeyP" && perf.fps) perf.fps.hidden = !perf.fps.hidden;
  if ((e.code === "KeyF" || e.code === "Enter") && focus) openViewer(focus);
  if (e.code.startsWith("Arrow") || e.code === "Space") e.preventDefault();
});
addEventListener("keyup", (e) => keys.delete(e.code));
addEventListener("blur", () => keys.clear());
canvas.addEventListener("click", () => {
  if (!running || TOUCH) return;
  if (!locked) { try { canvas.requestPointerLock()?.catch?.(() => {}); } catch { /* drag instead */ } }
  else if (focus) openViewer(focus);
});
document.addEventListener("pointerlockchange", () => {
  locked = document.pointerLockElement === canvas;
  $("dot").hidden = !locked && !TOUCH;
});
addEventListener("mousemove", (e) => {
  if (!locked) return;
  me.yaw -= e.movementX * 0.0022;
  me.pitch = THREE.MathUtils.clamp(me.pitch - e.movementY * 0.0022, -1.3, 1.3);
});
// Touch, or a mouse that can't be captured: drag on the left to walk, on
// the right to look. A quick tap on a photograph opens it.
const drags = new Map();
canvas.addEventListener("pointerdown", (e) => {
  if (!running || locked) return;
  const left = e.clientX < innerWidth * 0.42 && e.pointerType === "touch";
  drags.set(e.pointerId, { left, x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, t: performance.now() });
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", (e) => {
  const d = drags.get(e.pointerId);
  if (!d) return;
  if (d.left) {
    const max = 60;
    stick.x = THREE.MathUtils.clamp((e.clientX - d.x0) / max, -1, 1);
    stick.y = THREE.MathUtils.clamp(-(e.clientY - d.y0) / max, -1, 1);
  } else {
    const k = e.pointerType === "touch" ? 0.005 : 0.0035;
    me.yaw -= (e.clientX - d.x) * k;
    me.pitch = THREE.MathUtils.clamp(me.pitch - (e.clientY - d.y) * k, -1.3, 1.3);
  }
  d.x = e.clientX;
  d.y = e.clientY;
});
const endDrag = (e) => {
  const d = drags.get(e.pointerId);
  if (!d) return;
  drags.delete(e.pointerId);
  if (d.left) { stick.x = 0; stick.y = 0; }
  const tap = Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 10 && performance.now() - d.t < 300;
  if (tap && e.pointerType === "touch") {
    const hit = pick(e.clientX, e.clientY);
    if (hit) openViewer(hit);
  }
};
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

// ---------- Looking at a photograph ----------
const ray = new THREE.Raycaster();
ray.far = 11;
const ndc = new THREE.Vector2();
function pick(px, py) {
  ndc.set((px / innerWidth) * 2 - 1, -(py / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(photoMeshes, false)[0];
  return hit?.object.userData.photo ?? null;
}
let focus = null;
const card = $("card");
function showCard(P) {
  if (P === focus) return;
  focus = P;
  card.classList.toggle("on", !!P);
  if (!P) return;
  card.querySelector("h2").textContent = P.title ?? "Untitled";
  card.querySelector(".meta").textContent = ["Steven Guarino", P.category, month(P.dateTaken)].filter(Boolean).join(" · ");
  card.querySelector(".exif").textContent = [P.aperture, P.shutter && `${P.shutter} s`, P.iso && `ISO ${P.iso}`].filter(Boolean).join(" · ");
  card.querySelector(".how").textContent = TOUCH ? "Tap the photo to see it" : "Click or press F to see it";
}
const viewer = $("viewer");
function openViewer(P) {
  viewer.querySelector("img").src = `${ROOT}photos/thumbs/${P.stem}-1200.jpg`;
  viewer.querySelector("img").alt = P.alt ?? P.title ?? "";
  viewer.querySelector("p").textContent = P.title ?? "";
  viewer.classList.add("on");
  keys.clear();
  if (locked) document.exitPointerLock();
}
function closeViewer() {
  viewer.classList.remove("on");
  if (!TOUCH) { try { canvas.requestPointerLock()?.catch?.(() => {}); } catch { /* fine */ } }
}
viewer.addEventListener("click", closeViewer);

// ---------- Going in ----------
$("hint").textContent = TOUCH ? "Drag on the left to walk · drag on the right to look · tap a photo" : "W A S D to walk · Shift to hurry · G and V try other floors and walls · F to view a photo";
if (TOUCH) $("howto").textContent = "Drag on the left to walk, on the right to look";
$("enter").addEventListener("click", () => {
  $("intro").classList.add("gone");
  running = true;
  startAudio();
  if (!TOUCH) { try { canvas.requestPointerLock()?.catch?.(() => {}); } catch { /* drag instead */ } }
  setTimeout(() => ($("hint").style.opacity = "0"), 9000);
  canvas.focus();
});

// ---------- Each frame ----------
const clock = new THREE.Clock();
// Watch the frame time and trade sharpness for smoothness when it's slow.
const perf = { acc: 0, n: 0, ms: 16, fps: $("fps") };
function watchSpeed(raw) {
  perf.acc += raw;
  perf.n++;
  if (perf.acc < 1.2) return;
  const ms = (perf.acc / perf.n) * 1000;
  perf.ms = ms;
  perf.acc = perf.n = 0;
  if (perf.fps && !perf.fps.hidden) perf.fps.textContent = `${Math.round(1000 / ms)} fps · ${Math.round(quality * 100)}%`;
  if (document.hidden || style !== "sleek") return;
  let q = quality;
  if (ms > 21) q = Math.max(0.5, q * (ms > 30 ? 0.8 : 0.9));
  else if (ms < 13 && q < 1) q = Math.min(1, q * 1.08);
  if (Math.abs(q - quality) > 0.01) {
    quality = q;
    mistMat.uniforms.uSteps.value = TOUCH ? 10 : quality < 0.7 ? 16 : 22;
    applyStyle(style);
  }
}
function frame() {
  const raw = clock.getDelta();
  const dt = Math.min(raw, 0.1);
  if (running) watchSpeed(raw);
  const t = clock.elapsedTime;
  if (running && !viewer.classList.contains("on")) walk(dt);
  const bob = Math.sin(me.stride * 7.4) * 0.018 * Math.min(1, Math.hypot(me.vx, me.vz) / 2.3);
  camera.position.set(me.x, EYE + bob, me.z);
  camera.rotation.set(me.pitch, me.yaw, 0);
  skyGroup.position.copy(camera.position);
  // Dust drifting down the moonlight, and lifting again at the top.
  const p = dustGeo.attributes.position.array;
  for (let i = 0; i < DUST; i++) {
    const s = dustSeed[i];
    const fall = 0.004 * (0.5 + (s % 1));
    p[i * 3] += Math.sin(t * 0.3 + s) * 0.0016 + (DX / CEIL) * fall;
    p[i * 3 + 1] -= fall;
    p[i * 3 + 2] += Math.cos(t * 0.23 + s) * 0.0016 + (DZ / CEIL) * fall;
    if (p[i * 3 + 1] < 0.1) {
      p[i * 3] -= DX;
      p[i * 3 + 1] = CEIL;
      p[i * 3 + 2] -= DZ;
    }
  }
  dustGeo.attributes.position.needsUpdate = true;
  motes.rotation.y = Math.sin(t * 0.02) * 0.004;
  motes.position.y = Math.sin(t * 0.13) * 0.15;
  // The globes and the desk lamp breathe a little.
  globeMat.emissiveIntensity = 0.16 + Math.sin(t * 0.7) * 0.015;
  stepGuard(t, dt);
  stepCar(dt);
  if (audio?.ctx.listener) {
    const L = audio.ctx.listener;
    const fwd = new THREE.Vector3();
    camera.getWorldDirection(fwd);
    if (L.positionX) {
      L.positionX.value = camera.position.x; L.positionY.value = camera.position.y; L.positionZ.value = camera.position.z;
      L.forwardX.value = fwd.x; L.forwardY.value = fwd.y; L.forwardZ.value = fwd.z;
      L.upX.value = 0; L.upY.value = 1; L.upZ.value = 0;
    } else { L.setPosition(camera.position.x, camera.position.y, camera.position.z); L.setOrientation(fwd.x, fwd.y, fwd.z, 0, 1, 0); }
  }
  if (running && !viewer.classList.contains("on")) showCard(pick(innerWidth / 2, innerHeight / 2));
  render(t);
}
renderer.setAnimationLoop(frame);
window.__gallery = { me, camera, renderer, applyStyle, frame, get focus() { return focus; }, hung, hero, guard, car };
</script>
</body>
