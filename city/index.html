<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verdant Bay</title>
<meta name="description" content="A sunny island city full of trees. Take any car and drive.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* One look: a bright day. Glass panels over the scene, ink on frost. */
  :root {
    --sky: #bfe0ff;
    --ink: #0f1d2b;
    --soft: rgba(15, 29, 43, 0.62);
    --glass: rgba(255, 255, 255, 0.72);
    --edge: rgba(15, 29, 43, 0.12);
    --leaf: #2f9e5b;
    --sun: #ffb627;
    --stop: #e4473a;
    --display: "Archivo Black", "Arial Black", Impact, sans-serif;
    --body: Inter, system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { margin: 0; height: 100%; background: var(--sky); color: var(--ink); overflow: hidden; font-family: var(--body); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
  canvas#view { display: block; width: 100vw; height: 100vh; outline: none; touch-action: none; }
  .hud { position: fixed; z-index: 10; pointer-events: none; }
  .panel { background: var(--glass); border: 1px solid var(--edge); border-radius: 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 6px 24px rgba(15, 29, 43, 0.12); }

  #speed { right: calc(20px + env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); padding: 12px 18px 12px; min-width: 120px; text-align: right; }
  #speed b { display: block; font: 400 44px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  #speed small { display: block; margin-top: 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--soft); }
  #speed .gear { display: inline-block; margin-right: 8px; padding: 1px 6px; border-radius: 4px; background: var(--ink); color: #fff; letter-spacing: 0.05em; }
  #speed[hidden] { display: none; }
  #map { left: calc(20px + env(safe-area-inset-left, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: 190px; height: 190px; border-radius: 50%; overflow: hidden; padding: 0; }
  #map canvas { width: 100%; height: 100%; display: block; }
  #street { left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 8px 14px; font-size: 13px; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap; }
  #hint { left: 50%; top: calc(18px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); padding: 9px 14px; font-size: 13px; font-weight: 500; opacity: 0; transition: opacity 300ms ease; white-space: nowrap; }
  #hint.on { opacity: 1; }
  #hint kbd { display: inline-block; min-width: 18px; padding: 1px 6px; margin: 0 2px; border-radius: 5px; background: var(--ink); color: #fff; font: 600 12px/1.5 var(--body); text-align: center; }
  #keys { right: calc(20px + env(safe-area-inset-right, 0px)); top: calc(18px + env(safe-area-inset-top, 0px)); padding: 10px 14px; font-size: 12px; line-height: 1.8; color: var(--soft); }
  #keys b { color: var(--ink); font-weight: 600; }
  #fps { left: calc(20px + env(safe-area-inset-left, 0px)); top: calc(18px + env(safe-area-inset-top, 0px)); font: 11px ui-monospace, monospace; color: var(--soft); }

  #intro { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 24px; text-align: center;
    background: linear-gradient(180deg, rgba(191, 224, 255, 0.2), rgba(191, 224, 255, 0.75)); transition: opacity 500ms ease; }
  #intro.gone { opacity: 0; pointer-events: none; }
  #intro .card { padding: 34px 38px 30px; max-width: 30rem; }
  #intro h1 { margin: 0; font: 400 clamp(44px, 8vw, 76px)/0.95 var(--display); letter-spacing: -0.02em; text-wrap: balance; }
  #intro h1 span { color: var(--leaf); }
  #intro p { margin: 14px 0 24px; font-size: 16px; line-height: 1.5; color: var(--soft); }
  #intro button { font: 700 14px/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: #fff; background: var(--ink); border: 0; padding: 15px 30px; border-radius: 999px; cursor: pointer; }
  #intro button:hover, #intro button:focus-visible { background: var(--leaf); outline: none; }
  #intro small { display: block; margin-top: 20px; font-size: 12px; line-height: 1.8; color: var(--soft); }
  @media (max-width: 640px) {
    #map { width: 130px; height: 130px; }
    #keys { display: none; }
    #speed b { font-size: 34px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="intro">
  <div class="card panel">
    <h1>Verdant <span>Bay</span></h1>
    <p>A sunny island city, more trees than people. Any car on the street is yours if you want it.</p>
    <button id="go" type="button">Drive</button>
    <small>W A S D drive · Space handbrake · F get in / out · H horn · C camera · mouse to look</small>
  </div>
</div>
<div class="hud panel" id="speed"><b>0</b><small><span class="gear">1</span>km/h</small></div>
<div class="hud panel" id="map"><canvas width="380" height="380"></canvas></div>
<div class="hud panel" id="street"></div>
<div class="hud panel" id="hint"></div>
<div class="hud panel" id="keys"><b>W S</b> gas, brake · <b>A D</b> steer<br><b>Space</b> handbrake · <b>F</b> in / out<br><b>H</b> horn · <b>C</b> camera</div>
<div class="hud" id="fps" hidden></div>

<script type="module">
import * as THREE from "three";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

// ---------- Verdant Bay ----------
// An island city on a bright day: a grid of streets, towers in one corner
// thinning out to houses with gardens, parks, palms along the water, and
// trees on every sidewalk. Traffic keeps to its lanes and stops at the
// lights; people walk the sidewalks; any car can be yours.

const $ = (id) => document.getElementById(id);
const TOUCH = matchMedia("(pointer: coarse)").matches;

// The street grid: roads run along x = k*P and z = k*P for k = 0..N.
const N = 10; // blocks each way
const P = 72; // from one road's middle to the next
const RW = 7; // half the road's width (one lane each way, with room to park)
const SW = 4; // sidewalk width
const EDGE = RW + SW; // a road's middle to the edge of its block's lot
const CURB = 0.15;
const LO = 3.2; // a lane's middle, from the road's middle
const SIZE = N * P;

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const canvas = renderer.domElement;
canvas.id = "view";
canvas.tabIndex = 0;
document.body.prepend(canvas);

const scene = new THREE.Scene();
const HAZE = new THREE.Color(0xcfe3f5);
scene.background = HAZE.clone();
scene.fog = new THREE.Fog(HAZE, 220, 760);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.25, 40000);
camera.rotation.order = "YXZ";

// ---------- Sun and sky ----------
const SUN_DIR = new THREE.Vector3(0.42, 0.78, 0.46).normalize();
const sun = new THREE.DirectionalLight(0xfff0d8, 3.0);
sun.castShadow = true;
sun.shadow.mapSize.set(TOUCH ? 1024 : 2048, TOUCH ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -75, right: 75, top: 75, bottom: -75, near: 1, far: 400 });
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xcfe6ff, 0x7d7058, 1.15);
scene.add(hemi);
// Keep the sun's shadows centred on you, snapped to its texels so they
// don't crawl as you move.
const _sv = new THREE.Vector3();
function aimSun(x, z) {
  const texel = 150 / sun.shadow.mapSize.x;
  const sx = Math.round(x / texel) * texel;
  const sz = Math.round(z / texel) * texel;
  sun.target.position.set(sx, 0, sz);
  sun.position.copy(_sv.copy(SUN_DIR).multiplyScalar(200)).add(sun.target.position);
}

const skyGroup = new THREE.Group();
scene.add(skyGroup);
{
  const mat = new THREE.ShaderMaterial({
    uniforms: { uSun: { value: SUN_DIR } },
    vertexShader: `varying vec3 vDir; void main() { vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform vec3 uSun;
      varying vec3 vDir;
      void main() {
        float y = max(vDir.y, 0.0);
        vec3 c = mix(vec3(0.81, 0.89, 0.96), vec3(0.24, 0.55, 0.92), pow(y, 0.55));
        float s = max(dot(normalize(vDir), uSun), 0.0);
        c += vec3(1.0, 0.9, 0.7) * (pow(s, 600.0) * 4.0 + pow(s, 12.0) * 0.18);
        gl_FragColor = vec4(c, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
  });
  const dome = new THREE.Mesh(new THREE.SphereGeometry(2000, 32, 16), mat);
  dome.renderOrder = -2;
  skyGroup.add(dome);
  // Fair-weather clouds.
  const cv = document.createElement("canvas");
  cv.width = 256;
  cv.height = 128;
  const g = cv.getContext("2d");
  const r = rng(9);
  for (let i = 0; i < 26; i++) {
    const x = 40 + r() * 176;
    const y = 50 + r() * 40 - Math.abs(x - 128) * 0.15;
    const rad = 18 + r() * 26;
    const grad = g.createRadialGradient(x, y, 0, x, y, rad);
    grad.addColorStop(0, "rgba(255,255,255,0.9)");
    grad.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = grad;
    g.fillRect(0, 0, 256, 128);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  for (let i = 0; i < 22; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, fog: false, depthWrite: false, opacity: 0.85, transparent: true }));
    const a = r() * Math.PI * 2;
    const d = 700 + r() * 900;
    s.position.set(Math.cos(a) * d, 260 + r() * 260, Math.sin(a) * d);
    s.scale.set(400 + r() * 300, 160 + r() * 90, 1);
    s.renderOrder = -1;
    skyGroup.add(s);
  }
}

// ---------- Helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rng(seed) {
  let s = seed >>> 0;
  return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
}
const R = rng(20251120);
const pick = (a) => a[Math.floor(R() * a.length)];
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function canvasTex(w, h, draw, repeat = true) {
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, maxAniso);
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const hexs = (c) => "#" + c.toString(16).padStart(6, "0");
const shade = (c, k) => {
  const r = Math.min(255, Math.max(0, ((c >> 16) & 255) * k));
  const g = Math.min(255, Math.max(0, ((c >> 8) & 255) * k));
  const b = Math.min(255, Math.max(0, (c & 255) * k));
  return `rgb(${r | 0},${g | 0},${b | 0})`;
};
function noiseFill(g, w, h, base, amount, seed, cell = 1) {
  const r = rng(seed);
  for (let y = 0; y < h; y += cell) for (let x = 0; x < w; x += cell) {
    g.fillStyle = shade(base, 1 + (r() - 0.5) * amount);
    g.fillRect(x, y, cell, cell);
  }
}
function plane(w, h, tw = w, th = h, u0 = 0, v0 = 0) {
  const g = new THREE.PlaneGeometry(w, h);
  const uv = g.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, (uv.getX(i) * w + u0) / tw, (uv.getY(i) * h + v0) / th);
  return g;
}
function box(w, h, d, tw = 1, th = 1) {
  const g = new THREE.BoxGeometry(w, h, d);
  const uv = g.attributes.uv;
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++) {
    const i = f * 4 + k;
    uv.setXY(i, (uv.getX(i) * dims[f][0]) / tw, (uv.getY(i) * dims[f][1]) / th);
  }
  return g;
}
// Static geometry, merged per material (and per shadow setting).
const bins = new Map();
const tmpM = new THREE.Matrix4();
const tmpQ = new THREE.Quaternion();
const tmpE = new THREE.Euler();
const tmpV = new THREE.Vector3();
const ONE = new THREE.Vector3(1, 1, 1);
function put(geo, mat, { x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, cast = true, recv = true, sx = 1, sy = 1, sz = 1 } = {}) {
  geo.applyMatrix4(tmpM.compose(tmpV.set(x, y, z), tmpQ.setFromEuler(tmpE.set(rx, ry, rz)), new THREE.Vector3(sx, sy, sz)));
  const key = mat.uuid + (cast ? "c" : "") + (recv ? "r" : "");
  if (!bins.has(key)) bins.set(key, { mat, cast, recv, list: [] });
  bins.get(key).list.push(geo.index ? geo : geo);
}
function flush(parent = scene) {
  for (const { mat, cast, recv, list } of bins.values()) {
    // Mixed indexed / non-indexed lists can't merge: make them all indexed.
    const geos = list.map((g) => (g.index ? g : g.toNonIndexed && g));
    for (let i = 0; i < geos.length; i += 4000) {
      const mesh = new THREE.Mesh(mergeGeometries(geos.slice(i, i + 4000)), mat);
      mesh.castShadow = cast;
      mesh.receiveShadow = recv;
      mesh.matrixAutoUpdate = false;
      parent.add(mesh);
    }
  }
  bins.clear();
}

// ---------- Textures ----------
const T = {
  asphalt: canvasTex(128, 128, (g) => {
    noiseFill(g, 128, 128, 0x55585d, 0.16, 1, 2);
    const r = rng(2);
    for (let i = 0; i < 9; i++) { g.fillStyle = `rgba(30,32,36,${0.1 + r() * 0.1})`; g.fillRect(r() * 128, r() * 128, 10 + r() * 30, 6 + r() * 20); }
    for (let i = 0; i < 60; i++) { g.fillStyle = "rgba(190,190,185,0.25)"; g.fillRect(r() * 128, r() * 128, 1, 1); }
  }),
  sidewalk: canvasTex(64, 64, (g) => {
    noiseFill(g, 64, 64, 0xc9c3b6, 0.08, 3, 2);
    g.fillStyle = "rgba(90,85,75,0.45)";
    g.fillRect(0, 0, 64, 1);
    g.fillRect(0, 0, 1, 64);
    g.fillRect(0, 32, 64, 1);
    g.fillRect(32, 0, 1, 64);
  }),
  grass: canvasTex(128, 128, (g) => {
    noiseFill(g, 128, 128, 0x5f9a3e, 0.22, 5, 2);
    const r = rng(6);
    for (let i = 0; i < 500; i++) { g.fillStyle = r() < 0.5 ? "rgba(140,190,80,0.5)" : "rgba(40,90,30,0.4)"; g.fillRect(r() * 128, r() * 128, 1, 2 + r() * 3); }
    for (let i = 0; i < 14; i++) { g.fillStyle = pick(["#f4e04d", "#ffffff", "#f29bbb"]); g.fillRect(r() * 128, r() * 128, 2, 2); }
  }),
  plaza: canvasTex(64, 64, (g) => {
    const r = rng(7);
    for (let y = 0; y < 64; y += 8) for (let x = (y / 8) % 2 ? -8 : 0; x < 64; x += 16) {
      g.fillStyle = shade(0xd8c7a6, 0.9 + r() * 0.18);
      g.fillRect(x + 1, y + 1, 15, 7);
    }
    g.globalCompositeOperation = "destination-over";
    g.fillStyle = "#9a8d74";
    g.fillRect(0, 0, 64, 64);
  }),
  path: canvasTex(64, 64, (g) => noiseFill(g, 64, 64, 0xd9c9a3, 0.12, 8, 2)),
  roof: canvasTex(64, 64, (g) => noiseFill(g, 64, 64, 0x8b8b88, 0.18, 9, 2)),
  hedge: canvasTex(64, 64, (g) => {
    noiseFill(g, 64, 64, 0x3d7a34, 0.35, 10, 2);
    const r = rng(11);
    for (let i = 0; i < 200; i++) { g.fillStyle = r() < 0.5 ? "rgba(120,180,70,0.6)" : "rgba(20,60,20,0.5)"; g.fillRect(r() * 64, r() * 64, 2, 2); }
  }),
  sand: canvasTex(64, 64, (g) => noiseFill(g, 64, 64, 0xe8d8ae, 0.08, 12, 2)),
  wall: canvasTex(64, 64, (g) => {
    noiseFill(g, 64, 64, 0xd8d2c4, 0.06, 13, 2);
    g.fillStyle = "rgba(0,0,0,0.12)";
    for (let y = 0; y < 64; y += 16) g.fillRect(0, y, 64, 1);
  }),
};

// Facades: one texture is one bay, 4 m wide and one 3.5 m storey tall.
function facade(draw) { return canvasTex(64, 56, draw); }
function windowAt(g, x, y, w, h, glass, frame) {
  g.fillStyle = frame;
  g.fillRect(x - 2, y - 2, w + 4, h + 4);
  const grad = g.createLinearGradient(x, y, x + w, y + h);
  grad.addColorStop(0, glass[0]);
  grad.addColorStop(1, glass[1]);
  g.fillStyle = grad;
  g.fillRect(x, y, w, h);
  g.fillStyle = "rgba(255,255,255,0.35)";
  g.fillRect(x + 2, y + 2, Math.max(2, w * 0.25), 2);
}
const FACADES = {
  glass: [0x7fb3d9, 0x6aa1c8, 0x8ec3c9, 0x9db5c9].map((c, k) => facade((g) => {
    const grad = g.createLinearGradient(0, 0, 64, 56);
    grad.addColorStop(0, shade(c, 1.15));
    grad.addColorStop(1, shade(c, 0.78));
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 56);
    g.fillStyle = "rgba(255,255,255,0.22)";
    g.beginPath(); g.moveTo(10 + k * 8, 0); g.lineTo(26 + k * 8, 0); g.lineTo(8 + k * 8, 56); g.lineTo(-8 + k * 8, 56); g.fill();
    g.fillStyle = "#3c4a58";
    g.fillRect(0, 0, 64, 3);
    g.fillRect(0, 0, 2, 56);
    g.fillRect(31, 0, 2, 56);
  })),
  brick: [0xa8553c, 0x8f4a36, 0xb7765a].map((c) => facade((g) => {
    noiseFill(g, 64, 56, c, 0.14, c & 255, 2);
    g.fillStyle = "rgba(60,30,20,0.25)";
    for (let y = 0; y < 56; y += 4) g.fillRect(0, y, 64, 1);
    windowAt(g, 18, 12, 28, 30, ["#5b7d99", "#2c3e52"], "#efe9dc");
    g.fillStyle = "#e6dfcf";
    g.fillRect(14, 44, 36, 3);
  })),
  stucco: [0xf2d7c6, 0xf6e7b8, 0xcfe8dc, 0xf5f1e8, 0xf3c9b4, 0xd8e2f0].map((c) => facade((g) => {
    noiseFill(g, 64, 56, c, 0.05, c & 255, 2);
    windowAt(g, 22, 14, 20, 28, ["#6f8fa8", "#33475b"], "#ffffff");
    const sh = pick(["#3f7f6a", "#4a6fa5", "#b5643f", "#6b8f3a"]);
    g.fillStyle = sh;
    g.fillRect(12, 12, 8, 32);
    g.fillRect(44, 12, 8, 32);
    g.fillStyle = "rgba(0,0,0,0.15)";
    for (let y = 14; y < 44; y += 4) { g.fillRect(12, y, 8, 1); g.fillRect(44, y, 8, 1); }
  })),
  concrete: [0xd9d0bf, 0xc8c4bb, 0xe2d9c4].map((c) => facade((g) => {
    noiseFill(g, 64, 56, c, 0.06, c & 255, 2);
    windowAt(g, 4, 14, 56, 24, ["#7d9bb3", "#3c5266"], "#6d6a64");
    g.fillStyle = "rgba(0,0,0,0.2)";
    g.fillRect(31, 14, 2, 24);
  })),
  house: [0xf4efe4, 0xdfe9ef, 0xf1e1c2, 0xe7d4d0].map((c) => facade((g) => {
    noiseFill(g, 64, 56, c, 0.04, c & 255, 2);
    g.fillStyle = "rgba(0,0,0,0.07)";
    for (let y = 0; y < 56; y += 5) g.fillRect(0, y, 64, 1);
    windowAt(g, 20, 16, 24, 24, ["#7ea2bd", "#3d566d"], "#ffffff");
    g.fillStyle = "#ffffff";
    g.fillRect(31, 16, 2, 24);
  })),
};
// Shopfronts for the ground floor: big windows under an awning stripe.
const SHOPS = [0x2f7d6d, 0xc8553d, 0x2d5f9a, 0xe0a030, 0x7a4f9a, 0x3b3b3b].map((c) => facade((g) => {
  noiseFill(g, 64, 56, 0xe7e1d4, 0.05, 31, 2);
  windowAt(g, 6, 18, 52, 36, ["#a9c6d8", "#3f5a70"], hexs(c));
  g.fillStyle = hexs(c);
  g.fillRect(0, 2, 64, 12);
  g.fillStyle = "rgba(255,255,255,0.85)";
  for (let x = 0; x < 64; x += 8) g.fillRect(x, 2, 4, 12);
}));
const lam = (map, o = {}) => new THREE.MeshLambertMaterial({ map, ...o });
const M = {
  asphalt: lam(T.asphalt), sidewalk: lam(T.sidewalk), grass: lam(T.grass), plaza: lam(T.plaza), path: lam(T.path),
  roof: lam(T.roof), hedge: lam(T.hedge), sand: lam(T.sand), wall: lam(T.wall),
  white: new THREE.MeshLambertMaterial({ color: 0xf2f2ec }),

  const bushes = [];
  const R = rng(t.ox * 13 + t.oz * 7 + 99);
  const pick = (a) => a[Math.floor(R() * a.length)];
  const parks = new Set(t.parks);
  // In town coordinates; colliders go in at world coordinates.
  const box_ = (x0, z0, x1, z1, h) => addBox(t.ox + x0, t.oz + z0, t.ox + x1, t.oz + z1, h);
  const post_ = (x, z, r) => addPost(t.ox + x, t.oz + z, r);

  // The road surface under the whole town, a little past its edge.
  const A0 = -EDGE - 6;
  const A1 = size + EDGE + 6;
  put(plane(A1 - A0, A1 - A0, 8, 8), M.asphalt, { x: (A0 + A1) / 2, y: 0, z: (A0 + A1) / 2, rx: -Math.PI / 2, cast: false });

  function hedge(x0, z0, x1, z1, h = 1.1) {
    const w = Math.max(0.6, x1 - x0);
    const d = Math.max(0.6, z1 - z0);
    put(box(w, h, d, 1.5, 1.5), M.hedge, { x: (x0 + x1) / 2, y: CURB + h / 2, z: (z0 + z1) / 2 });
    box_(x0, z0, x0 + w, z0 + d, h);
  }
  function walls(x0, z0, x1, z1, y0, y1, mat, th = 3.5) {
    const w = x1 - x0;
    const d = z1 - z0;
    const h = y1 - y0;
    const cy = (y0 + y1) / 2;
    const twW = w / Math.max(1, Math.round(w / 4));
    const twD = d / Math.max(1, Math.round(d / 4));
    put(plane(w, h, twW, th, 0, y0 - CURB), mat, { x: (x0 + x1) / 2, y: cy, z: z1 });
    put(plane(w, h, twW, th, 0, y0 - CURB), mat, { x: (x0 + x1) / 2, y: cy, z: z0, ry: Math.PI });
    put(plane(d, h, twD, th, 0, y0 - CURB), mat, { x: x1, y: cy, z: (z0 + z1) / 2, ry: Math.PI / 2 });
    put(plane(d, h, twD, th, 0, y0 - CURB), mat, { x: x0, y: cy, z: (z0 + z1) / 2, ry: -Math.PI / 2 });
  }
  function flatRoof(x0, z0, x1, z1, y) {
    const w = x1 - x0;
    const d = z1 - z0;
    put(plane(w, d, 4, 4), M.roof, { x: (x0 + x1) / 2, y, z: (z0 + z1) / 2, rx: -Math.PI / 2 });
    for (const [x, z, ww, dd] of [[(x0 + x1) / 2, z0 + 0.15, w, 0.3], [(x0 + x1) / 2, z1 - 0.15, w, 0.3], [x0 + 0.15, (z0 + z1) / 2, 0.3, d], [x1 - 0.15, (z0 + z1) / 2, 0.3, d]]) put(box(ww, 0.7, dd, 2, 1), M.wall, { x, y: y + 0.35, z });
    const r = R();
    if (w > 8 && d > 8) {
      for (let k = 0; k < 2 + Math.floor(r * 3); k++) put(box(1.4, 1, 1.2), M.metal, { x: x0 + 2 + R() * (w - 4), y: y + 0.5, z: z0 + 2 + R() * (d - 4) });
      if (r < 0.35) {
        const tx = x0 + 2.5 + R() * (w - 5);
        const tz = z0 + 2.5 + R() * (d - 5);
        put(new THREE.CylinderGeometry(1.1, 1.1, 2.4, 10), M.wood, { x: tx, y: y + 2.4, z: tz });
        put(new THREE.ConeGeometry(1.2, 0.8, 10), M.darkMetal, { x: tx, y: y + 4.0, z: tz });
        for (const [dx, dz] of [[-0.7, -0.7], [0.7, -0.7], [-0.7, 0.7], [0.7, 0.7]]) put(box(0.12, 1.2, 0.12), M.darkMetal, { x: tx + dx, y: y + 0.6, z: tz + dz });
      } else if (r < 0.6) {
        for (let k = 0; k < 6 + Math.floor(R() * 8); k++) bushes.push({ x: x0 + 1.5 + R() * (w - 3), y: y + 0.2, z: z0 + 1.5 + R() * (d - 3), s: 0.7 + R() * 0.7 });
      }
    }
  }
  function building(x0, z0, x1, z1, kind, faces) {
    const w = x1 - x0;
    const d = z1 - z0;
    let h;
    let mat;
    if (kind === "tower") {
      const near = Math.hypot((x0 + x1) / 2 / P - t.downtown[0], (z0 + z1) / 2 / P - t.downtown[1]);
      h = Math.round((30 + R() * 70 * Math.max(0.3, 1.4 - near * 0.45)) / 3.5) * 3.5;
      mat = R() < 0.65 ? pick(facadeMats.glass) : pick(facadeMats.concrete);
    } else if (kind === "mid") {
      h = (3 + Math.floor(R() * (t.style === "city" ? 6 : 3))) * 3.5;
      mat = pick([...facadeMats.brick, ...facadeMats.stucco, ...facadeMats.stucco, ...facadeMats.concrete]);
    } else {
      h = (1 + Math.floor(R() * 2)) * 3.5;
      mat = pick([...facadeMats.house, ...facadeMats.stucco]);
    }
    const top = CURB + h;
    if (kind !== "house" && R() < 0.8) {
      walls(x0, z0, x1, z1, CURB, CURB + 4, pick(shopMats), 4);
      walls(x0, z0, x1, z1, CURB + 4, top, mat);
      const am = new THREE.MeshLambertMaterial({ color: pick([0xc8553d, 0x2f7d6d, 0xe0a030, 0x2d5f9a, 0xf2efe6]) });
      for (const f of faces) {
        if (R() < 0.4) continue;
        const len = (f === "n" || f === "s" ? w : d) * 0.8;
        if (f === "s") put(box(len, 0.08, 1.4), am, { x: (x0 + x1) / 2, y: CURB + 3.4, z: z0 - 0.7, rx: -0.25 });
        if (f === "n") put(box(len, 0.08, 1.4), am, { x: (x0 + x1) / 2, y: CURB + 3.4, z: z1 + 0.7, rx: 0.25 });
        if (f === "w") put(box(1.4, 0.08, len), am, { x: x0 - 0.7, y: CURB + 3.4, z: (z0 + z1) / 2, rz: 0.25 });
        if (f === "e") put(box(1.4, 0.08, len), am, { x: x1 + 0.7, y: CURB + 3.4, z: (z0 + z1) / 2, rz: -0.25 });
      }
    } else walls(x0, z0, x1, z1, CURB, top, mat);
    if (kind === "house") {
      const roof = new THREE.ConeGeometry(Math.SQRT1_2, 1, 4, 1);
      roof.rotateY(Math.PI / 4);
      put(roof, R() < 0.6 ? M.terracotta : M.slate, { x: (x0 + x1) / 2, y: top + 1.2, z: (z0 + z1) / 2, sx: w + 0.8, sy: 2.4, sz: d + 0.8 });
    } else if (kind === "tower" && h > 50 && w > 14 && d > 14 && R() < 0.6) {
      const i = 2.5;
      const h2 = Math.round((10 + R() * 30) / 3.5) * 3.5;
      flatRoof(x0, z0, x1, z1, top);
      walls(x0 + i, z0 + i, x1 - i, z1 - i, top, top + h2, mat);
      flatRoof(x0 + i, z0 + i, x1 - i, z1 - i, top + h2);
      h += h2;
    } else flatRoof(x0, z0, x1, z1, top);
    box_(x0, z0, x1, z1, h + CURB);
  }
  function parcels(x0, z0, x1, z1, min, out) {
    const w = x1 - x0;
    const d = z1 - z0;
    if ((w < min * 2 && d < min * 2) || (out.length > 6 && R() < 0.5)) { out.push([x0, z0, x1, z1]); return out; }
    if (w >= d) { const cut = x0 + w * (0.35 + R() * 0.3); parcels(x0, z0, cut, z1, min, out); parcels(cut, z0, x1, z1, min, out); }
    else { const cut = z0 + d * (0.35 + R() * 0.3); parcels(x0, z0, x1, cut, min, out); parcels(x0, cut, x1, z1, min, out); }
    return out;
  }

  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const bx0 = i * P + RW;
    const bz0 = j * P + RW;
    const bx1 = (i + 1) * P - RW;
    const bz1 = (j + 1) * P - RW;
    const lx0 = bx0 + SW;
    const lz0 = bz0 + SW;
    const lx1 = bx1 - SW;
    const lz1 = bz1 - SW;
    const dd = Math.hypot(i + 0.5 - t.downtown[0], j + 0.5 - t.downtown[1]);
    let kind;
    if (parks.has(`${i},${j}`)) kind = "park";
    else if (t.style === "city") kind = dd < 2.0 ? "tower" : dd < 4.2 ? "mid" : "house";
    else if (t.style === "harbor") kind = dd < 1.6 ? "mid" : "house";
    else kind = "house";
    if (kind === "mid" && R() < 0.08) kind = "park";
    t.blocks.push({ kind, x0: t.ox + lx0, z0: t.oz + lz0, x1: t.ox + lx1, z1: t.oz + lz1, i, j });
    put(box(bx1 - bx0, CURB, bz1 - bz0, 2, 2), M.sidewalk, { x: (bx0 + bx1) / 2, y: CURB / 2, z: (bz0 + bz1) / 2, cast: false });
    const green = kind === "park" || kind === "house";
    put(plane(lx1 - lx0, lz1 - lz0, green ? 6 : 3, green ? 6 : 3), green ? M.grass : M.plaza, { x: (lx0 + lx1) / 2, y: CURB + 0.01, z: (lz0 + lz1) / 2, rx: -Math.PI / 2, cast: false });
    for (const side of ["s", "n", "w", "e"]) {
      const along = side === "s" || side === "n";
      const fixed = side === "s" ? bz0 + 1.3 : side === "n" ? bz1 - 1.3 : side === "w" ? bx0 + 1.3 : bx1 - 1.3;
      const a0 = (along ? bx0 : bz0) + 6;
      const a1 = (along ? bx1 : bz1) - 6;
      for (let a = a0; a <= a1; a += kind === "tower" ? 11 : 9) {
        if (R() < 0.12) continue;
        trees.push({ x: along ? a : fixed, z: along ? fixed : a, s: 0.8 + R() * 0.45, kind: kind === "house" && R() < 0.25 ? "cypress" : "round" });
      }
    }
    if (kind === "park") {
      const cx = (lx0 + lx1) / 2;
      const cz = (lz0 + lz1) / 2;
      put(plane(lx1 - lx0, 3, 3, 3), M.path, { x: cx, y: CURB + 0.02, z: cz, rx: -Math.PI / 2, cast: false });
      put(plane(3, lz1 - lz0, 3, 3), M.path, { x: cx, y: CURB + 0.025, z: cz, rx: -Math.PI / 2, cast: false });
      const pond = R() < 0.6;
      const pr = 7 + R() * 3;
      const px_ = cx + (R() < 0.5 ? -1 : 1) * 11;
      const pz = cz + (R() < 0.5 ? -1 : 1) * 11;
      if (pond) {
        const pm = new THREE.Mesh(new THREE.CircleGeometry(pr, 28), new THREE.MeshPhongMaterial({ color: 0x3a9fbf, specular: 0xffffff, shininess: 90 }));
        pm.rotation.x = -Math.PI / 2;
        pm.position.set(px_, CURB + 0.04, pz);
        pm.receiveShadow = true;
        g.add(pm);
        put(new THREE.TorusGeometry(pr, 0.25, 6, 28), M.wall, { x: px_, y: CURB + 0.05, z: pz, rx: Math.PI / 2 });
        post_(px_, pz, pr - 0.5);
      }
      let placed = 0;
      for (let k = 0; k < 140 && placed < 46; k++) {
        const x = lx0 + 2 + R() * (lx1 - lx0 - 4);
        const z = lz0 + 2 + R() * (lz1 - lz0 - 4);
        if (Math.abs(x - cx) < 3 || Math.abs(z - cz) < 3) continue;
        if (pond && Math.hypot(x - px_, z - pz) < pr + 2) continue;
        trees.push({ x, z, s: 0.9 + R() * 0.8, kind: R() < 0.15 ? "cypress" : "round" });
        placed++;
      }
      for (let k = 0; k < 40; k++) {
        const x = lx0 + 1 + R() * (lx1 - lx0 - 2);
        const z = lz0 + 1 + R() * (lz1 - lz0 - 2);
        if (Math.abs(x - cx) < 2.5 || Math.abs(z - cz) < 2.5 || (pond && Math.hypot(x - px_, z - pz) < pr + 1)) continue;
        bushes.push({ x, y: CURB, z, s: 0.6 + R() * 0.8 });
      }
      for (const [x, z, ry] of [[cx - 8, cz + 2.4, 0], [cx + 8, cz - 2.4, Math.PI], [cx + 2.4, cz + 8, Math.PI / 2], [cx - 2.4, cz - 8, -Math.PI / 2]]) {
        put(box(1.8, 0.08, 0.5), M.wood, { x, y: CURB + 0.48, z, ry });
        put(box(1.8, 0.45, 0.08), M.wood, { x: x + Math.sin(ry) * 0.25, y: CURB + 0.75, z: z + Math.cos(ry) * 0.25, ry });
      }
      continue;
    }
    const faces = (p) => [p[1] <= lz0 + 0.1 && "s", p[3] >= lz1 - 0.1 && "n", p[0] <= lx0 + 0.1 && "w", p[2] >= lx1 - 0.1 && "e"].filter(Boolean);
    const list = parcels(lx0, lz0, lx1, lz1, kind === "tower" ? 16 : kind === "mid" ? 11 : 14, []);
    for (const p of list) {
      const inset = kind === "tower" ? 1 : kind === "mid" ? 0.4 : 3.5;
      const [x0, z0, x1, z1] = [p[0] + inset, p[1] + inset, p[2] - inset, p[3] - inset];
      if (x1 - x0 < 5 || z1 - z0 < 5) continue;
      if (kind === "tower" && R() < 0.12) {
        for (let k = 0; k < 4; k++) {
          const x = x0 + 2 + R() * (x1 - x0 - 4);
          const z = z0 + 2 + R() * (z1 - z0 - 4);
          put(box(2.4, 0.6, 2.4), M.wall, { x, y: CURB + 0.3, z });
          box_(x - 1.2, z - 1.2, x + 1.2, z + 1.2, 0.6);
          trees.push({ x, z, s: 0.8, kind: "round", y: 0.6 });
        }
        continue;
      }
      building(x0, z0, x1, z1, kind, faces(p));
      if (kind === "house") {
        for (const f of faces(p)) {
          if (f === "s") hedge(p[0] + 1, p[1] + 0.3, p[2] - 1, p[1] + 1.1);
          if (f === "n") hedge(p[0] + 1, p[3] - 1.1, p[2] - 1, p[3] - 0.3);
          if (f === "w") hedge(p[0] + 0.3, p[1] + 1, p[0] + 1.1, p[3] - 1);
          if (f === "e") hedge(p[2] - 1.1, p[1] + 1, p[2] - 0.3, p[3] - 1);
        }
        for (let k = 0; k < 1 + Math.floor(R() * 3); k++) {
          const c = [[p[0] + 1.8, p[1] + 1.8], [p[2] - 1.8, p[1] + 1.8], [p[0] + 1.8, p[3] - 1.8], [p[2] - 1.8, p[3] - 1.8]][Math.floor(R() * 4)];
          trees.push({ x: c[0], z: c[1], s: 0.9 + R() * 0.5, kind: R() < 0.3 ? "cypress" : "round" });
        }
        for (let k = 0; k < 5; k++) bushes.push({ x: x0 - 1 + R() * (x1 - x0 + 2), y: CURB, z: R() < 0.5 ? z0 - 0.9 : z1 + 0.9, s: 0.5 + R() * 0.5 });
      } else if (kind === "mid") {
        for (let k = 0; k < 3; k++) bushes.push({ x: x0 + R() * (x1 - x0), y: CURB, z: R() < 0.5 ? z0 - 0.7 : z1 + 0.7, s: 0.45 + R() * 0.3 });
      }
    }
  }

  // Crossings, markings, traffic lights, lamps.
  for (let i = 0; i <= n; i++) for (let j = 0; j <= n; j++) {
    const nd = { t, i, j, x: t.ox + i * P, z: t.oz + j * P, phase: R() * 20 };
    t.nodes.push(nd);
    nodes.push(nd);
  }
  t.nodeAt = (i, j) => (i < 0 || j < 0 || i > n || j > n ? null : t.nodes[i * (n + 1) + j]);
  {
    const quad = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
    const whites = [];
    const yellows = [];
    const mark = (list, x, z, w, d) => list.push(new THREE.Matrix4().compose(new THREE.Vector3(x, 0.02, z), new THREE.Quaternion(), new THREE.Vector3(w, 1, d)));
    for (let k = 0; k <= n; k++) for (let s = 0; s < n; s++) {
      const a0 = s * P + RW + 3.2;
      const a1 = (s + 1) * P - RW - 3.2;
      const mid = (a0 + a1) / 2;
      const len = a1 - a0;
      for (const o of [-0.16, 0.16]) { mark(yellows, k * P + o, mid, 0.11, len); mark(yellows, mid, k * P + o, len, 0.11); }
      mark(whites, k * P - LO, a0 - 0.2, 2 * LO - 0.4, 0.4);
      mark(whites, k * P + LO, a1 + 0.2, 2 * LO - 0.4, 0.4);
      mark(whites, a0 - 0.2, k * P + LO, 0.4, 2 * LO - 0.4);
      mark(whites, a1 + 0.2, k * P - LO, 0.4, 2 * LO - 0.4);
    }
    for (const nd of t.nodes) for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      if (!t.nodeAt(nd.i + dx, nd.j + dz)) continue;
      const cx = nd.i * P + dx * (RW + 1.6);
      const cz = nd.j * P + dz * (RW + 1.6);
      for (let q = -RW + 0.8; q <= RW - 0.8; q += 1.1) {
        if (dx) mark(whites, cx, nd.j * P + q, 2.4, 0.55);
        else mark(whites, nd.i * P + q, cz, 0.55, 2.4);
      }
    }
    for (const [list, mat] of [[whites, M.white], [yellows, M.yellow]]) {
      const im = new THREE.InstancedMesh(quad, mat, list.length);
      list.forEach((m, k) => im.setMatrixAt(k, m));
      im.receiveShadow = true;
      g.add(im);
    }
  }
  for (const nd of t.nodes) for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    if (!t.nodeAt(nd.i - dx, nd.j - dz)) continue;
    const rx = -dz;
    const rz = dx;
    const x = nd.i * P - dx * (RW + 3.6) + rx * (RW + 0.9);
    const z = nd.j * P - dz * (RW + 3.6) + rz * (RW + 0.9);
    put(new THREE.CylinderGeometry(0.09, 0.11, 4.2, 6), M.darkMetal, { x, y: CURB + 2.1, z });
    const ry = Math.atan2(-dx, -dz);
    put(box(0.42, 1.15, 0.32), M.darkMetal, { x, y: CURB + 4.3, z, ry });
    post_(x, z, 0.2);
    t.heads.push({ n: nd, axis: dx ? "x" : "z", x: x - dx * 0.17, z: z - dz * 0.17, ry, state: -1 });
  }
  t.lamps = new THREE.InstancedMesh(new THREE.CircleGeometry(0.13, 10), new THREE.MeshBasicMaterial({ toneMapped: false }), Math.max(1, t.heads.length));
  g.add(t.lamps);
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    for (const [x, z, ry] of [[i * P + P / 2, j * P + RW + 0.5, 0], [i * P + RW + 0.5, j * P + P / 2, Math.PI / 2]]) {
      put(new THREE.CylinderGeometry(0.08, 0.12, 6, 6), M.darkMetal, { x, y: CURB + 3, z });
      put(box(0.1, 0.1, 1.6), M.darkMetal, { x: x + (ry ? -0.8 : 0), y: CURB + 6, z: z + (ry ? 0 : -0.8), ry });
      put(box(0.5, 0.18, 0.3), M.metal, { x: x + (ry ? -1.5 : 0), y: CURB + 5.9, z: z + (ry ? 0 : -1.5), ry });
      post_(x, z, 0.18);
    }
  }
  flush(g);

  // The town's trees and bushes, instanced.
  const round = trees.filter((q) => q.kind === "round");
  const cyp = trees.filter((q) => q.kind === "cypress");
  const Y = (q) => CURB + (q.y || 0);
  for (const q of trees) post_(q.x, q.z, 0.3 * q.s);
  const blobs = [];
  for (const q of round) {
    const r = rng(Math.round(q.x * 31 + q.z * 7));
    const c = TREE.greens[Math.floor(r() * TREE.greens.length)];
    blobs.push({ x: q.x, y: Y(q) + 3.6 * q.s, z: q.z, s: 2.0 * q.s, sy: 1.7 * q.s, c });
    blobs.push({ x: q.x + (r() - 0.5) * 1.6 * q.s, y: Y(q) + (4.6 + r() * 0.6) * q.s, z: q.z + (r() - 0.5) * 1.6 * q.s, s: 1.4 * q.s, sy: 1.3 * q.s, c });
  }
  for (const b of bushes) blobs.push({ x: b.x, y: b.y + b.s * 0.45, z: b.z, s: b.s, sy: b.s * 0.75, c: TREE.greens[Math.floor(Math.abs(b.x * 13 + b.z) % TREE.greens.length)] });
  const add = (m) => m && g.add(m);
  add(instanced(TREE.trunk, TREE.bark, [...round, ...cyp], (q, m) => m.compose(tmpV.set(q.x, Y(q), q.z), tmpQ.identity(), new THREE.Vector3(q.s, (q.kind === "cypress" ? 1.6 : 2.6) * q.s, q.s))));
  add(instanced(TREE.blobFine, TREE.leaf, blobs, (b, m) => m.compose(tmpV.set(b.x, b.y, b.z), tmpQ.setFromEuler(tmpE.set(0, b.x, 0)), new THREE.Vector3(b.s, b.sy, b.s)), (b) => b.c));
  add(instanced(TREE.cone, TREE.leaf, cyp, (q, m) => m.compose(tmpV.set(q.x, Y(q) + 1.2 * q.s, q.z), tmpQ.identity(), new THREE.Vector3(q.s, 7 * q.s, q.s)), () => TREE.pine[0]));
}
for (const t of TOWNS) buildTown(t);

function updateLights(time) {
  for (const t of TOWNS) {
    let changed = false;
    t.heads.forEach((h, k) => {
      const s = lightFor(h.n, h.axis, time);
      if (s === h.state) return;
      h.state = s;
      changed = true;
      tmpM.compose(tmpV.set(h.x, CURB + 4.68 - s * 0.36, h.z), tmpQ.setFromEuler(tmpE.set(0, h.ry, 0)), ONE);
      t.lamps.setMatrixAt(k, tmpM);
      t.lamps.setColorAt(k, LIGHT_COLS[s]);

    for (const f of [350, 440]) tone({ dur: 0.35, type: "square", f0: f, gain: 0.08 * vol, pan, band: 900 });
  },
  bird() {
    const f = 2600 + Math.random() * 1600;
    const pan = Math.random() * 1.6 - 0.8;
    for (let k = 0; k < 2 + Math.floor(Math.random() * 3); k++) tone({ t: k * 0.12, dur: 0.09, f0: f, f1: f * (Math.random() < 0.5 ? 1.4 : 0.7), gain: 0.035, pan });
  },
  splash() { burst({ dur: 0.9, f0: 2500, f1: 200, gain: 0.7 }); },
};
function honkAt(c) { if (Math.hypot(c.x - camera.position.x, c.z - camera.position.z) < 120) sfx.honk(c.x, c.z); }
// Every frame.
function updateAudio(dt, car, honking) {
  if (!AU.ctx) return;
  const e = AU.engine;
  const t = anow();
  const ease = (param, v, k = 0.06) => param.setTargetAtTime(v, t, k);
  if (car) {
    const rpm = car.rpm;
    const f = (rpm / 60) * 2;
    ease(e.o1.frequency, f, 0.03);
    ease(e.o2.frequency, f / 2, 0.03);
    ease(e.o3.frequency, f * 1.503, 0.03);
    const thr = car.in.thr;
    ease(e.lp.frequency, 260 + thr * 1500 + rpm * 0.18, 0.05);
    ease(e.eng.gain, (0.09 + thr * 0.12) * (car.shift ? 0.4 : 1), 0.05);
    const sp = Math.hypot(car.vx, car.vz);
    ease(AU.tyre.g.gain, car.grounded && car.slip > 2.5 && sp > 4 ? clamp((car.slip - 2.5) * 0.04, 0, 0.22) : 0, 0.05);
    ease(AU.tyre.f.frequency, 1100 + car.slip * 30, 0.1);
    ease(AU.wind.g.gain, clamp((sp * sp) / 9000, 0, 0.3), 0.2);
    ease(AU.gravel.g.gain, car.offroad && car.grounded ? clamp(sp * 0.012, 0, 0.35) : 0, 0.1);
  } else {
    ease(e.eng.gain, 0, 0.2);
    ease(AU.tyre.g.gain, 0, 0.1);
    ease(AU.wind.g.gain, 0, 0.3);
    ease(AU.gravel.g.gain, 0, 0.1);
  }
  ease(AU.horn.gain, honking ? 0.09 : 0, 0.02);
  // The sea, louder near the shore.
  const h = terrainH(camera.position.x, camera.position.z);
  ease(AU.sea.g.gain, clamp((6 - h) * 0.03, 0, 0.16) * (0.6 + 0.4 * Math.sin(t * 0.4)), 0.4);
  if (Math.random() < dt * 0.35 && !townAt(camera.position.x, camera.position.z) || Math.random() < dt * 0.12) sfx.bird();
}

// ---------- Playing ----------
const keys = new Set();
const state = { mode: "drive", car: null, time: 0, camMode: 0, ready: false, started: false };
let camYaw = 0; // which way the camera faces (same sense as a car's heading)
let camPitch = 0.12;
let lookOff = 0; // how far the mouse has turned the view from straight behind
let lookIdle = 9;
let shake = 0;
let steerIn = 0;

// Your car to start: a coupe on Juniper Avenue, pointing north.
const START = { x: 5 * P - LO, z: 2 * P + 30, h: 0 };
state.car = makeCar("coupe", 0xd8352a, START.x, START.z, START.h);
state.car.awake = true;
camYaw = START.h;
spawnTraffic(START.x, START.z);

// ---------- The map ----------
const MAP = { x0: ISLE.cx - ISLE.rx * 1.08, z0: ISLE.cz - ISLE.rz * 1.08, s: 0.25 };
const worldMap = document.createElement("canvas");
{
  const w = Math.ceil(ISLE.rx * 2.16 * MAP.s);
  const h = Math.ceil(ISLE.rz * 2.16 * MAP.s);
  worldMap.width = w;
  worldMap.height = h;
  const g = worldMap.getContext("2d");
  const step = 4;
  for (let y = 0; y < h; y += step) for (let x = 0; x < w; x += step) {
    const wx = MAP.x0 + x / MAP.s;
    const wz = MAP.z0 + y / MAP.s;
    const e = natH(wx, wz);
    g.fillStyle = e < 0 ? "#7cc3dd" : e < 3 ? "#eadcae" : e > 60 ? "#7fa86a" : "#9cc77e";
    g.fillRect(x, y, step, step);
  }
  const X = (x) => (x - MAP.x0) * MAP.s;
  const Z = (z) => (z - MAP.z0) * MAP.s;
  g.lineCap = "round";
  g.lineJoin = "round";
  for (const road of roads) {
    for (const [w, c] of [[5, "#ffffff"], [3, "#f2b13c"]]) {
      g.strokeStyle = c;
      g.lineWidth = w;
      g.beginPath();
      road.S.forEach((p, i) => (i ? g.lineTo(X(p.x), Z(p.z)) : g.moveTo(X(p.x), Z(p.z))));
      g.stroke();
    }
  }
  for (const t of TOWNS) {
    g.fillStyle = "#e7e1d3";
    g.fillRect(X(t.ox - RW), Z(t.oz - RW), (t.size + 2 * RW) * MAP.s, (t.size + 2 * RW) * MAP.s);
    for (const b of t.blocks) {
      g.fillStyle = b.kind === "park" ? "#8cc56c" : b.kind === "house" ? "#cfe0b4" : "#c9bfae";
      g.fillRect(X(b.x0 - SW), Z(b.z0 - SW), (b.x1 - b.x0 + 2 * SW) * MAP.s, (b.z1 - b.z0 + 2 * SW) * MAP.s);
    }
  }
}
const mapEl = $("map").querySelector("canvas");
const mapG = mapEl.getContext("2d");
function drawMap(x, z, heading) {
  const W = mapEl.width;
  mapG.save();
  mapG.fillStyle = "#7cc3dd";
  mapG.fillRect(0, 0, W, W);
  mapG.translate(W / 2, W / 2);
  mapG.rotate(heading + Math.PI);
  const k = 2.2; // canvas pixels per map pixel
  mapG.scale(k, k);
  mapG.drawImage(worldMap, -(x - MAP.x0) * MAP.s, -(z - MAP.z0) * MAP.s);
  mapG.fillStyle = "#3a7bd5";
  for (const c of traffic) {
    const dx = (c.x - x) * MAP.s;
    const dz = (c.z - z) * MAP.s;
    if (Math.abs(dx) < 90 && Math.abs(dz) < 90) mapG.fillRect(dx - 1.2, dz - 1.2, 2.4, 2.4);
  }
  mapG.restore();
  mapG.fillStyle = "#0f1d2b";
  mapG.beginPath();
  mapG.moveTo(W / 2, W / 2 - 13);
  mapG.lineTo(W / 2 + 9, W / 2 + 10);
  mapG.lineTo(W / 2, W / 2 + 5);
  mapG.lineTo(W / 2 - 9, W / 2 + 10);
  mapG.closePath();
  mapG.fill();
  // The towns, as labels at the edge when they're off the map.
  mapG.font = "600 20px Inter, sans-serif";
  mapG.textAlign = "center";
  mapG.textBaseline = "middle";
  for (const t of TOWNS) {
    const cx = t.ox + t.size / 2;
    const cz = t.oz + t.size / 2;
    const dx = (cx - x) * MAP.s * k;
    const dz = (cz - z) * MAP.s * k;
    const a = heading + Math.PI;
    let sx = dx * Math.cos(a) - dz * Math.sin(a);
    let sy = dx * Math.sin(a) + dz * Math.cos(a);
    const d = Math.hypot(sx, sy);
    const lim = W / 2 - 70;
    if (d > lim) { sx *= lim / d; sy *= lim / d; }
    const label = d > lim ? `${t.name} ${(Math.hypot(cx - x, cz - z) / 1000).toFixed(1)} km` : t.name;
    mapG.font = `600 ${d > lim ? 17 : 20}px Inter, sans-serif`;
    const tw = mapG.measureText(label).width;
    mapG.fillStyle = "rgba(255,255,255,0.85)";
    mapG.fillRect(W / 2 + sx - tw / 2 - 6, W / 2 + sy - 13, tw + 12, 26);
    mapG.fillStyle = "#0f1d2b";
    mapG.fillText(label, W / 2 + sx, W / 2 + sy + 1);
  }
}

// ---------- Getting in and out ----------
function nearestCar(x, z, reach = 3.4) {
  let best = null;
  let bd = reach;
  for (const c of cars) {
    if (c === state.car && state.mode === "drive") continue;
    // Distance to the car's side, roughly.
    const fx = Math.sin(c.h);
    const fz = Math.cos(c.h);
    const dx = x - c.x;
    const dz = z - c.z;
    const along = clamp(dx * fx + dz * fz, -c.T.L / 2, c.T.L / 2);
    const d = Math.hypot(dx - fx * along, dz - fz * along) - c.T.W / 2;
    if (d < bd) { bd = d; best = c; }
  }
  return best;
}
function toggleCar() {
  if (state.mode === "drive") {
    const c = state.car;
    if (Math.hypot(c.vx, c.vz) > 4) return;
    const lx = Math.cos(c.h);
    const lz = -Math.sin(c.h);
    me.x = c.x + lx * (c.T.W / 2 + 0.6);
    me.z = c.z + lz * (c.T.W / 2 + 0.6);
    me.y = groundAt(me.x, me.z);
    me.h = c.h;
    me.vx = me.vz = 0;
    me.g.visible = true;
    Object.assign(c.in, { thr: 0, brk: 0, steer: 0, hb: true });
    state.mode = "foot";
    sfx.door();
  } else {
    const c = nearestCar(me.x, me.z);
    if (!c) return;
    if (c.ai) {
      // Someone's driving it: they get out and run.
      const p = peds.reduce((a, b) => (Math.hypot(a.x - me.x, a.z - me.z) > Math.hypot(b.x - me.x, b.z - me.z) ? a : b));
      p.x = c.x + Math.cos(c.h) * (c.T.W / 2 + 0.7);
      p.z = c.z - Math.sin(c.h) * (c.T.W / 2 + 0.7);
      p.mode = "run";
      p.t = 0;
      p.h = Math.atan2(p.x - me.x, p.z - me.z);
      if (!p.loop) placePed(p, p.x, p.z);
      sfx.shout(p);
      const k = traffic.indexOf(c);
      if (k >= 0) traffic.splice(k, 1);
      c.ai = null;
    }
    c.parked = false;
    c.awake = true;
    state.car = c;
    state.mode = "drive";
    me.g.visible = false;
    camYaw = c.h;
    lookOff = 0;
    sfx.door();
  }
}
// Back onto the nearest road (after a swim).
function rescue(c) {
  let best = null;
  let bd = 1e9;
  for (const road of roads) for (let i = 40; i < road.S.length - 40; i += 5) {
    const p = road.S[i];
    const d = Math.hypot(p.x - c.x, p.z - c.z);
    if (d < bd) { bd = d; best = { x: p.x - p.dz * HW_LANE, z: p.z + p.dx * HW_LANE, h: Math.atan2(p.dx, p.dz) }; }
  }
  for (const n of nodes) {
    const d = Math.hypot(n.x - c.x, n.z - c.z);
    if (d < bd) { bd = d; best = { x: n.x - LO, z: n.z + RW + 6, h: 0 }; }
  }
  placeCar(c, best.x, best.z, best.h);
  camYaw = best.h;
}

// ---------- Input ----------
let locked = false;
canvas.addEventListener("mousedown", () => { if (state.started && !locked) { try { const r = canvas.requestPointerLock?.(); if (r?.catch) r.catch(() => {}); } catch { /* fine */ } } });
document.addEventListener("pointerlockchange", () => (locked = document.pointerLockElement === canvas));
document.addEventListener("mousemove", (e) => {
  if (!locked) return;
  if (state.mode === "foot") camYaw -= e.movementX * 0.0025;
  else lookOff -= e.movementX * 0.0025;
  camPitch = clamp(camPitch + e.movementY * 0.002, -0.35, 0.9);
  lookIdle = 0;
});
addEventListener("keydown", (e) => {
  if (!state.started) return;
  if (e.repeat && e.code !== "KeyH") return;
  keys.add(e.code);
  if (e.code === "KeyF" || e.code === "Enter") toggleCar();
  if (e.code === "KeyC") state.camMode = (state.camMode + 1) % 3;
  if (e.code === "KeyP") $("fps").hidden = !$("fps").hidden;
  if (e.code.startsWith("Arrow") || e.code === "Space") e.preventDefault();
});
addEventListener("keyup", (e) => keys.delete(e.code));
addEventListener("blur", () => keys.clear());

// ---------- Quality ----------
let quality = 1;
function applySize() {
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75, Math.sqrt(3.2e6 / (innerWidth * innerHeight))) * quality);
  renderer.setSize(innerWidth, innerHeight);
}
applySize();
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); applySize(); });
const perf = { acc: 0, n: 0 };
function watchSpeed(raw) {
  perf.acc += raw;
  perf.n++;
  if (perf.acc < 1.5) return;
  const ms = (perf.acc / perf.n) * 1000;
  perf.acc = perf.n = 0;
  if (!$("fps").hidden) $("fps").textContent = `${Math.round(1000 / ms)} fps · ${Math.round(quality * 100)}% · ${renderer.info.render.calls} draws`;
  if (document.hidden) return;
  let q = quality;
  if (ms > 21) q = Math.max(0.5, q * (ms > 30 ? 0.82 : 0.9));
  else if (ms < 13 && q < 1) q = Math.min(1, q * 1.08);
  if (Math.abs(q - quality) > 0.01) { quality = q; applySize(); }
}

// ---------- Each frame ----------
const hud = { speed: $("speed"), speedB: $("speed").querySelector("b"), gear: $("speed").querySelector(".gear"), street: $("street"), hint: $("hint") };
let last = {};
const setText = (el, k, v) => { if (last[k] !== v) { last[k] = v; el.textContent = v; } };
function hint(html) {
  if (last.hint === html) return;
  last.hint = html;
  if (html) hud.hint.innerHTML = html;
  hud.hint.classList.toggle("on", !!html);
}
let skidT = 0;
let mapT = 0;
const _look = new THREE.Vector3();
const _want = new THREE.Vector3();
function physics(dt) {
  const px = state.mode === "drive" ? state.car.x : me.x;
  const pz = state.mode === "drive" ? state.car.z : me.z;
  const active = cars.filter((c) => c === state.car || c.ai || c.awake);
  for (const c of active) {
    if (Math.abs(c.x - px) > 420 || Math.abs(c.z - pz) > 420) continue;
    stepCar(c, dt);
    const hit = hitStatics(c);
    if (hit > 3 && c === state.car && state.mode === "drive") { sfx.crash(hit, c.x, c.z); shake = Math.min(1, shake + hit / 14); }
    if (!c.ai && c !== state.car && Math.hypot(c.vx, c.vz) < 0.05) c.awake = false;
  }
  // Cars against cars (including parked ones you run into).
  const near = cars.filter((c) => Math.abs(c.x - px) < 160 && Math.abs(c.z - pz) < 160);
  for (let i = 0; i < near.length; i++) for (let j = i + 1; j < near.length; j++) {
    const a = near[i];
    const b = near[j];
    const imp = hitCars(a, b);
    if (imp > 1.5) {
      if (a === state.car || b === state.car) { if (state.mode === "drive") { sfx.crash(imp, a.x, a.z); shake = Math.min(1, shake + imp / 14); } }
      for (const c of [a, b]) if (c.ai && imp > 2.5) { c.ai.stunned = 1.5 + Math.random() * 2; if (Math.random() < 0.7) setTimeout(() => honkAt(c), 300 + Math.random() * 500); }
    }
  }
}
function step(dt) {
  state.time += dt;
  const car = state.car;
  if (state.mode === "drive") {
    const target = (keys.has("KeyD") || keys.has("ArrowRight") ? 1 : 0) - (keys.has("KeyA") || keys.has("ArrowLeft") ? 1 : 0);
    const rate = target === 0 ? 5 : Math.sign(target) !== Math.sign(steerIn) ? 6 : 2.6;
    steerIn += clamp(target - steerIn, -rate * dt, rate * dt);
    car.in.thr = keys.has("KeyW") || keys.has("ArrowUp") ? 1 : 0;
    car.in.brk = keys.has("KeyS") || keys.has("ArrowDown") ? 1 : 0;
    car.in.steer = steerIn;
    car.in.hb = keys.has("Space");
  }
  updateTraffic(dt, state.time, car.x, car.z);
  // Two physics steps a frame: steadier at speed.
  physics(dt / 2);
  physics(dt / 2);
  if (car.land > 0.5 && state.mode === "drive" && !car.landed) { sfx.land(car.land); shake = Math.min(1, shake + car.land * 0.6); car.landed = true; }
  if (car.land <= 0.1) car.landed = false;
  if (car.drowned) { sfx.splash(); rescue(car); if (state.mode === "foot") { me.x = car.x + 3; me.z = car.z; } }
  if (state.mode === "foot") updateMe(dt, camYaw);
  const px = state.mode === "drive" ? car.x : me.x;
  const pz = state.mode === "drive" ? car.z : me.z;
  if (townAt(px, pz, 300)) { for (const p of peds) p.g.visible = true; updatePeds(dt, px, pz); }
  else for (const p of peds) p.g.visible = false;
  streamLand(px, pz, state.started ? 3 : 6);
  updateLights(state.time);
  updateLandmarks(dt);
  skidT -= dt;
  for (const c of cars) {
    if (c.grounded && (c.slip > 3.2 || (c.in.hb && Math.abs(c.vl) > 6) || (c.in.brk && c.vl > 12 && c === car)) && skidT <= 0 && Math.abs(c.x - px) < 120 && Math.abs(c.z - pz) < 120) skid(c);
  }
  if (skidT <= 0) skidT = 0.035;
  drawCars(camera.position.x, camera.position.z);
  aimSun(px, pz);
  placeCamera(dt);
  // HUD.
  const sp = Math.hypot(car.vx, car.vz) * 3.6;
  hud.speed.hidden = state.mode !== "drive";
  setText(hud.speedB, "sp", String(Math.round(state.mode === "drive" ? sp : 0)));
  setText(hud.gear, "gear", car.vl < -0.5 ? "R" : String(car.gear));
  setText(hud.street, "street", placeName(px, pz));
  if (state.mode === "foot") {
    const c = nearestCar(me.x, me.z);
    hint(c ? `<kbd>F</kbd> ${c.ai ? "Take this car" : "Get in"}` : "");
  } else hint(sp < 14 ? "<kbd>F</kbd> Get out" : "");
  mapT -= dt;
  if (mapT <= 0) { mapT = 0.05; drawMap(px, pz, state.mode === "drive" ? car.h : camYaw); }
  updateAudio(dt, state.mode === "drive" ? car : null, keys.has("KeyH"));
}
function placeCamera(dt) {
  lookIdle += dt;
  shake = Math.max(0, shake - dt * 1.6);
  const car = state.car;
  let tx;
  let ty;
  let tz;
  let dist;
  let height;
  if (state.mode === "drive") {
    const sp = Math.hypot(car.vx, car.vz);
    if (lookIdle > 1.2) lookOff *= Math.pow(0.04, dt);
    // The camera swings round behind the car a little late, so you feel it turn.
    const behind = car.vl < -2 ? car.h : car.h;
    let d = behind + lookOff - camYaw;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    camYaw += d * Math.min(1, dt * (2.8 + sp * 0.02));
    if (lookIdle > 1.2) camPitch += (0.12 - camPitch) * Math.min(1, dt * 1.5);
    tx = car.x;
    ty = car.y + 1.1;
    tz = car.z;
    if (state.camMode === 2) {
      // From the bonnet.
      camera.position.set(car.x + Math.sin(car.h) * 0.6, car.y + car.T.H - 0.05, car.z + Math.cos(car.h) * 0.6);
      camera.rotation.set(-car.pitch * 0.6 - camPitch * 0.3 + 0.02, car.h + Math.PI + lookOff, car.roll * 0.6);
      camera.fov += (66 + clamp(sp * 0.3, 0, 18) - camera.fov) * Math.min(1, dt * 3);
      camera.updateProjectionMatrix();
      return;
    }
    dist = (state.camMode === 1 ? 10.5 : 6.6) + sp * 0.022;
    height = (state.camMode === 1 ? 3.6 : 2.2) + sp * 0.006;
    camera.fov += (60 + clamp(sp * 0.33, 0, 20) - camera.fov) * Math.min(1, dt * 3);
  } else {
    tx = me.x;
    ty = me.y + 1.55;
    tz = me.z;
    dist = 4.4;
    height = 0.8;
    camera.fov += (60 - camera.fov) * Math.min(1, dt * 3);
  }
  camera.updateProjectionMatrix();
  const cp = Math.cos(camPitch);
  _want.set(tx - Math.sin(camYaw) * dist * cp, ty + height * 0.6 + Math.sin(camPitch) * dist, tz - Math.cos(camYaw) * dist * cp);
  // Don't put the camera inside a building: pull in until it's clear.
  for (let k = 1; k <= 8; k++) {
    const f = k / 8;
    const x = tx + (_want.x - tx) * f;
    const z = tz + (_want.z - tz) * f;
    let blocked = false;
    for (const s of nearStatics(x, z, 0.5)) if (s.box && s.h > 3 && x > s.x0 - 0.3 && x < s.x1 + 0.3 && z > s.z0 - 0.3 && z < s.z1 + 0.3) blocked = true;
    if (blocked) { _want.x = tx + (_want.x - tx) * (f - 0.14); _want.z = tz + (_want.z - tz) * (f - 0.14); break; }
  }
  _want.y = Math.max(_want.y, groundAt(_want.x, _want.z) + 0.5);
  camera.position.lerp(_want, Math.min(1, dt * 12));
  const s = shake * 0.12;
  _look.set(tx + (Math.random() - 0.5) * s, ty + (Math.random() - 0.5) * s, tz);
  camera.lookAt(_look);
  skyGroup.position.copy(camera.position);
}
const clock = new THREE.Clock();
function frame() {
  const raw = clock.getDelta();
  const dt = Math.min(raw, 0.05);
  if (state.started) watchSpeed(raw);
  step(dt);
  renderer.render(scene, camera);
}
// Build the ground round the start before letting you drive.
{
  const btn = $("go");
  btn.disabled = true;
  btn.textContent = "Building the island…";
  let ticks = 0;
  const pre = () => {
    // Just the near ground first; the rest fills in once you're driving.
    const left = streamLand(START.x, START.z, 10, 1000);
    if (left > 0 && ticks++ < 400) { requestAnimationFrame(pre); return; }
    state.ready = true;
    btn.disabled = false;
    btn.textContent = "Drive";
  };
  requestAnimationFrame(pre);
  btn.addEventListener("click", () => {
    if (!state.ready) return;
    audioStart();
    state.started = true;
    $("intro").classList.add("gone");
    canvas.focus();
  });
}
renderer.setAnimationLoop(frame);
window.__city = { render: () => renderer.render(scene, camera), state, cars, traffic, peds, me, keys, step, camera, renderer, streamLand, roads, TOWNS, toggleCar, rescue, get camYaw() { return camYaw; } };
</script>
