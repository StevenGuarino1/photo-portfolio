<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Steven Guarino — Photography</title>

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

<meta property="og:type" content="website" />
<meta property="og:title" content="Steven Guarino — Photography" />
<meta property="og:description" content="Wildlife, astrophotography, macro, and street photography." />
<meta property="og:url" content="https://stevenguarino1.github.io/photo-portfolio/" />
<meta property="og:image" content="https://stevenguarino1.github.io/photo-portfolio/photos/4@2x.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Steven Guarino — Photography" />
<meta name="twitter:description" content="Wildlife, astrophotography, macro, and street photography." />
<meta name="twitter:image" content="https://stevenguarino1.github.io/photo-portfolio/photos/4@2x.jpg" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    --text: #111;
    --muted: #6b6b6b;
    /* matches levonbiss.com at 1400px: 42px side padding, 39px gutters */
    --gap: clamp(18px, 2.8vw, 40px);
    --side-padding: clamp(20px, 3vw, 42px);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #fff;
    color: var(--text);
    font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  a { color: inherit; }

  /* ---------- Header ---------- */

  .site-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px 32px;
    padding: clamp(26px, 2.9vw, 40px) var(--side-padding);
  }

  .site-header .logo {
    /* tracks the reference's fluid scaling: 22.1px @1024, 24.4px @1400 */
    font-size: clamp(1.15rem, 1rem + 0.6vw, 2.1rem);
    letter-spacing: -0.02em;
    font-weight: 400;
    text-decoration: none;
    white-space: nowrap;
  }

  .logo-mark {
    color: var(--muted);
    font-size: 0.82em;
  }

  .logo-mark::before {
    content: "/";
    margin-right: 0.5em;
    opacity: 0.45;
  }

  .site-nav {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 26px;
  }

  .nav-link {
    font-family: inherit;
    font-size: clamp(0.85rem, 0.7rem + 0.5vw, 1rem);
    color: inherit;
    background: none;
    border: 0;
    padding: 2px 0;
    cursor: pointer;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    opacity: 0.75;
    transition: opacity 150ms ease;
  }

  .nav-link:hover {
    opacity: 1;
  }

  .nav-link.is-active {
    opacity: 1;
    border-bottom-color: currentColor;
  }

  /* ---------- Gallery ---------- */

  main {
    padding: var(--side-padding) var(--side-padding) var(--gap);
  }

  .gallery {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }

  .gallery-row {
    display: flex;
    gap: var(--gap);
  }

  .gallery img {
    display: block;
    height: auto;
    min-width: 0;
    cursor: pointer;
    background: #f2f2f2;
  }

  /* ---------- Footer ---------- */

  .site-footer {
    padding: 28px var(--side-padding) 44px;
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
    line-height: 1.6;
  }

  .site-footer p { margin: 0; }

  /* ---------- Lightbox ---------- */

  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(24px) saturate(0.65);
    -webkit-backdrop-filter: blur(24px) saturate(0.65);
    opacity: 0;
    transition: opacity 200ms ease;
  }

  .lightbox[hidden] {
    display: flex;
    pointer-events: none;
  }

  .lightbox.is-open {
    opacity: 1;
    pointer-events: auto;
  }

  .lightbox-stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 99vw;
    max-height: 99vh;
  }

  .lightbox-frame {
    position: relative;
    display: inline-block;
    line-height: 0;
    isolation: isolate;
  }

  .lightbox-frame::before {
    content: "";
    position: absolute;
    inset: 0;
    transform: scale(2.2);
    background: radial-gradient(
      ellipse closest-side at center,
      rgba(0, 0, 0, 0.55) 0%,
      rgba(0, 0, 0, 0.55) calc(100% / 2.2),
      rgba(0, 0, 0, 0) 100%
    );
    pointer-events: none;
    z-index: -1;
  }

  #lightbox-img {
    display: block;
    width: auto;
    height: auto;
    max-width: var(--lb-max-w, 97vw);
    max-height: var(--lb-max-h, 92vh);
    border: 1px solid rgba(255, 255, 255, 0.12);
  }

  .lightbox-exif {
    margin: 16px 0 0;
    font-size: 1rem;
    color: #e8e8e8;
    text-align: center;
  }

  .lightbox-exif:empty { display: none; }

  body.lightbox-open { overflow: hidden; }
</style>
</head>
<body>

  <header class="site-header">
    <a class="logo" href="./">Steven Guarino <span class="logo-mark">Archive</span></a>
    <nav class="site-nav" id="siteNav">
      <button class="nav-link is-active" type="button" data-filter="all">All</button>
      <button class="nav-link" type="button" data-filter="Wildlife">Wildlife</button>
      <button class="nav-link" type="button" data-filter="Night Sky">Night Sky</button>
      <button class="nav-link" type="button" data-filter="Landscape">Landscape</button>
      <button class="nav-link" type="button" data-filter="Close-Up">Close-Up</button>
      <button class="nav-link" type="button" data-filter="Aviation">Aviation</button>
    </nav>
  </header>

  <main>
    <div class="gallery" id="grid"></div>
  </main>

  <footer class="site-footer">
    <p>Sony a6700 · Sigma 17-40mm f/1.8 · Sigma 150-600mm DG DN Sports</p>
  </footer>

  <div id="lightbox" class="lightbox" hidden>
    <div class="lightbox-stage">
      <div class="lightbox-frame">
        <img id="lightbox-img" src="" alt="" />
      </div>
      <p id="lightbox-exif" class="lightbox-exif"></p>
    </div>
  </div>

  <script src="js/photos.js?v=4"></script>
  <script>
    // ---------- Gallery ----------

    const orderedPhotos = PHOTOS.slice().sort((a, b) => {
      const da = a.dateTaken ? Date.parse(a.dateTaken) : 0;
      const db = b.dateTaken ? Date.parse(b.dateTaken) : 0;
      return db - da;
    });

    const grid = document.getElementById("grid");
    const ratioOf = (photo) => (photo.width && photo.height ? photo.width / photo.height : 1.5);

    const imgFor = new Map();
    orderedPhotos.forEach((photo, index) => {
      const img = document.createElement("img");
      img.src = photo.file;
      if (photo.file2x) img.srcset = `${photo.file} 1x, ${photo.file2x} 2x`;
      img.alt = photo.alt || "";
      if (photo.title) img.title = photo.title;
      if (photo.width && photo.height) {
        img.width = photo.width;
        img.height = photo.height;
      }
      img.loading = index < 6 ? "eager" : "lazy";
      img.decoding = "async";
      img.addEventListener("click", () => openLightbox(photo));
      imgFor.set(photo, img);
    });

    // Row size follows a repeating pattern of photos-per-row, so the page
    // alternates between bands of two large frames and bands of three or four
    // smaller ones. Fitting rows to target heights instead collapses toward a
    // single height, because most of this set shares one aspect ratio.
    function rowPlanFor(width) {
      if (width < 620) return { pattern: [1], maxH: width * 1.6, minH: 0 };
      if (width < 1000) return { pattern: [1, 2, 2, 3], maxH: width * 0.75, minH: width * 0.2 };
      return { pattern: [2, 4, 3, 2, 3, 4], maxH: width * 0.45, minH: width * 0.13 };
    }

    function layout(photos) {
      const width = grid.clientWidth;
      if (!width) return;

      const gap = parseFloat(getComputedStyle(grid).rowGap) || 0;
      const { pattern, maxH, minH } = rowPlanFor(width);

      const heightOf = (slice) => {
        const ratioSum = slice.reduce((sum, photo) => sum + ratioOf(photo), 0);
        return (width - gap * (slice.length - 1)) / ratioSum;
      };

      grid.textContent = "";
      let cursor = 0;
      let rowIndex = 0;

      while (cursor < photos.length) {
        const remaining = photos.length - cursor;
        let count = Math.min(pattern[rowIndex % pattern.length], remaining);

        // A run of portraits or panoramas can still tower or squash at the
        // pattern's count, so nudge it until the row sits in range.
        while (count < remaining && heightOf(photos.slice(cursor, cursor + count)) > maxH) count++;
        while (count > 1 && heightOf(photos.slice(cursor, cursor + count)) < minH) count--;

        const rowPhotos = photos.slice(cursor, cursor + count);
        const height = heightOf(rowPhotos);
        cursor += count;
        rowIndex += 1;

        // Only the final row can still exceed maxH, since there is nothing left
        // to add to it. Let it sit at maxH rather than fill the width.
        const loose = height > maxH;

        const row = document.createElement("div");
        row.className = "gallery-row";
        rowPhotos.forEach((photo) => {
          const img = imgFor.get(photo);
          if (loose) {
            img.style.flex = "0 0 auto";
            img.style.width = `${Math.round(maxH * ratioOf(photo))}px`;
          } else {
            img.style.flex = `${ratioOf(photo)} 1 0%`;
            img.style.width = "";
          }
          row.appendChild(img);
        });
        grid.appendChild(row);
      }
    }

    let visiblePhotos = orderedPhotos;
    layout(visiblePhotos);

    document.getElementById("siteNav").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-filter]");
      if (!btn) return;

      document
        .querySelectorAll("#siteNav .nav-link")
        .forEach((el) => el.classList.toggle("is-active", el === btn));

      const filter = btn.dataset.filter;
      visiblePhotos =
        filter === "all" ? orderedPhotos : orderedPhotos.filter((p) => p.category === filter);
      layout(visiblePhotos);
    });

    let lastWidth = window.innerWidth;
    let resizeTimer;
    window.addEventListener("resize", () => {
      if (window.innerWidth === lastWidth) return;
      lastWidth = window.innerWidth;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => layout(visiblePhotos), 150);
    });

    // ---------- Lightbox ----------

    function formatExif(photo) {
      const parts = [];
      if (photo.aperture) parts.push(photo.aperture);
      if (photo.shutter) parts.push(photo.shutter);
      if (photo.iso) parts.push(`ISO ${photo.iso}`);
      return parts.join(" · ");
    }

    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const lightboxExif = document.getElementById("lightbox-exif");

    function sizeLightboxImage() {
      const margin = 14;
      const captionSpace = 52;
      const maxW = Math.round(window.innerWidth - margin * 2);
      const maxH = Math.round(window.innerHeight - margin * 2 - captionSpace);
      lightboxImg.style.setProperty("--lb-max-w", `${maxW}px`);
      lightboxImg.style.setProperty("--lb-max-h", `${maxH}px`);
    }

    function openLightbox(photo) {
      lightboxImg.src = photo.file;
      lightboxImg.alt = photo.alt || "";
      if (photo.file2x) {
        lightboxImg.srcset = `${photo.file} 1x, ${photo.file2x} 2x`;
      } else {
        lightboxImg.removeAttribute("srcset");
      }
      lightboxExif.textContent = formatExif(photo);

      sizeLightboxImage();
      lightbox.hidden = false;
      document.body.classList.add("lightbox-open");
      requestAnimationFrame(() => lightbox.classList.add("is-open"));
    }

    function closeLightbox() {
      lightbox.classList.remove("is-open");
      document.body.classList.remove("lightbox-open");
      const onEnd = (e) => {
        if (e.target !== lightbox) return;
        lightbox.hidden = true;
        lightbox.removeEventListener("transitionend", onEnd);
      };
      lightbox.addEventListener("transitionend", onEnd);
    }

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox || e.target === lightbox.querySelector(".lightbox-stage")) {
        closeLightbox();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (lightbox.hidden) return;
      if (e.key === "Escape") closeLightbox();
    });

    window.addEventListener("resize", () => {
      if (!lightbox.hidden) sizeLightboxImage();
    });

  </script>
</body>
</html>
